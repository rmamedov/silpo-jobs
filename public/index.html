<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Сільпо — Вакансії</title>
<style>
/* =========================================================================
   Сільпо Design System — fonts
   ========================================================================= */
@font-face { font-family: "Silpo Text"; font-style: normal; font-weight: 100; src: url("fonts/SilpoText-Thin.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text"; font-style: normal; font-weight: 200; src: url("fonts/SilpoText-ExtraLight.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text"; font-style: normal; font-weight: 300; src: url("fonts/SilpoText-Light.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text"; font-style: normal; font-weight: 400; src: url("fonts/SilpoText-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text"; font-style: normal; font-weight: 500; src: url("fonts/SilpoText-Medium.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text"; font-style: normal; font-weight: 600; src: url("fonts/SilpoText-SemiBold.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text"; font-style: normal; font-weight: 700; src: url("fonts/SilpoText-Bold.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text"; font-style: normal; font-weight: 800; src: url("fonts/SilpoText-ExtraBold.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text"; font-style: normal; font-weight: 900; src: url("fonts/SilpoText-Black.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text Caption"; font-style: normal; font-weight: 400; src: url("fonts/SilpoText-CaptionRegular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text Caption"; font-style: normal; font-weight: 500; src: url("fonts/SilpoText-CaptionMedium.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text Caption"; font-style: normal; font-weight: 600; src: url("fonts/SilpoText-CaptionSemiBold.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Text Caption"; font-style: normal; font-weight: 700; src: url("fonts/SilpoText-CaptionBold.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Rounded"; font-style: normal; font-weight: 400; src: url("fonts/SilpoRounded-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Rounded"; font-style: normal; font-weight: 500; src: url("fonts/SilpoRounded-Medium.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Rounded"; font-style: normal; font-weight: 600; src: url("fonts/SilpoRounded-SemiBold.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Rounded"; font-style: normal; font-weight: 700; src: url("fonts/SilpoRounded-Bold.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Rounded"; font-style: normal; font-weight: 800; src: url("fonts/SilpoRounded-ExtraBold.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Silpo Rounded"; font-style: normal; font-weight: 900; src: url("fonts/SilpoRounded-Black.ttf") format("truetype"); font-display: swap; }

/* =========================================================================
   Design tokens
   ========================================================================= */
:root {
  --orange-100: #FFF0E0;
  --orange-200: #FFE1C1;
  --orange-300: #FFC384;
  --orange-400: #FF9B32;
  --orange-500: #FF8200;
  --orange-550: #F07A00;
  --orange-600: #FF6F00;
  --orange-700: #FF5C00;
  --orange-900: #D76609;
  --brand: var(--orange-500);
  --brand-press: var(--orange-700);
  --brand-tint: var(--orange-100);

  --blue-50:  #F6F8FD;
  --blue-100: #EEF2FC;
  --blue-200: #D3DEF5;
  --blue-300: #ACBFEE;
  --blue-400: #5881DB;
  --blue-500: #2358D1;
  --blue-600: #1A47C6;
  --blue-700: #1135BA;
  --blue-800: #0B2AA0;

  --neutral-100: #F1F2F8;
  --neutral-200: #E4E5ED;
  --neutral-300: #CECFD9;
  --neutral-400: #B6B8C6;
  --neutral-500: #A6A8B9;
  --neutral-600: #86889D;
  --neutral-700: #6C6E86;

  --green-100: #EBF9ED;
  --green-200: #CDF0D3;
  --green-300: #91DE9E;
  --green-400: #42C658;
  --green-500: #07B324;
  --green-600: #049B16;
  --green-700: #018308;
  --green-900: #005204;
  --success: var(--green-500);

  --yellow-100: #FFF6E0;
  --yellow-200: #FFEDC1;
  --yellow-300: #FFDB84;
  --yellow-400: #FFC232;
  --yellow-500: #FFB200;
  --yellow-600: #FF9D00;
  --yellow-700: #FF8C00;
  --yellow-900: #552F00;

  --red-100: #FFEBEF;
  --red-200: #FFCED7;
  --red-300: #FF93A8;
  --red-400: #FF4569;
  --red-500: #FF0A3B;
  --red-600: #E20934;
  --red-700: #C5082E;
  --red-900: #98001F;
  --error: var(--red-500);

  --pink-100: #FAE6F0;
  --pink-200: #F7D4E5;
  --pink-300: #F1B1D1;
  --pink-400: #EC89BA;
  --pink-500: #FF3399;
  --pink-600: #E9167F;
  --pink-700: #C20A66;

  --lblue-100: #E7F3F8;
  --lblue-200: #C9E1ED;
  --lblue-300: #9ED1EA;
  --lblue-400: #76C3EA;
  --lblue-500: #00AAFF;
  --lblue-600: #0087CB;
  --lblue-700: #006DA3;

  --violet-100: #EEE7FF;
  --violet-200: #DDD2FF;
  --violet-300: #C6AEFF;
  --violet-400: #AA80FF;
  --violet-500: #801BFF;
  --violet-600: #7916EB;
  --violet-700: #6512C5;

  --dark-blue: #172650;

  --black-base: 32,33,36;
  --black-87: rgba(32,33,36,0.87);
  --black-72: rgba(32,33,36,0.72);
  --black-60: rgba(32,33,36,0.60);
  --black-54: rgba(32,33,36,0.54);
  --black-38: rgba(32,33,36,0.38);
  --black-24: rgba(32,33,36,0.24);
  --black-12: rgba(32,33,36,0.12);
  --black-8:  rgba(32,33,36,0.08);
  --black-6:  rgba(32,33,36,0.06);
  --black-4:  rgba(32,33,36,0.04);

  --white-87: rgba(255,255,255,0.87);
  --white-72: rgba(255,255,255,0.72);
  --white-60: rgba(255,255,255,0.60);
  --white-54: rgba(255,255,255,0.54);
  --white-38: rgba(255,255,255,0.38);
  --white-24: rgba(255,255,255,0.24);
  --white-12: rgba(255,255,255,0.12);
  --white-8:  rgba(255,255,255,0.08);
  --white-6:  rgba(255,255,255,0.06);
  --white-4:  rgba(255,255,255,0.04);

  --surface: #FFFFFF;
  --surface-2: #F6F8FD;
  --surface-3: #F1F2F8;
  --canvas: #FFFFFF;

  --fg-1: var(--black-87);
  --fg-2: var(--black-72);
  --fg-3: var(--black-60);
  --fg-4: var(--black-38);
  --fg-on-brand: #FFFFFF;
  --link: var(--blue-500);

  --border-1: rgba(32,33,36,0.08);
  --border-2: rgba(32,33,36,0.12);
  --border-strong: rgba(32,33,36,0.24);

  --r-4:  4px;
  --r-8:  8px;
  --r-12: 12px;
  --r-16: 16px;
  --r-20: 20px;
  --r-24: 24px;
  --r-32: 32px;
  --r-pill: 999px;

  --shadow-volume: 0 1px 0 0 rgba(0,0,0,0.06);
  --shadow-outline: 0 0 0 1px rgba(32,33,36,0.06), 0 1px 0 0 rgba(0,0,0,0.06);
  --shadow-elev: 0 4px 4px 0 rgba(0,0,0,0.25);
  --shadow-focus: 0 0 0 4px rgba(32,33,36,0.24);

  --blur-sm: 24px;
  --blur-lg: 80px;

  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --s-10: 40px;
  --s-12: 48px;
  --s-16: 64px;

  --font-display: "Silpo Rounded", "Silpo Text", system-ui, -apple-system, sans-serif;
  --font-text:    "Silpo Text", system-ui, -apple-system, sans-serif;
  --font-caption: "Silpo Text Caption", "Silpo Text", system-ui, -apple-system, sans-serif;

  --t-12: 12px; --t-13: 13px; --t-14: 14px; --t-16: 16px; --t-18: 18px;
  --t-20: 20px; --t-22: 22px; --t-24: 24px; --t-32: 32px; --t-42: 42px;
  --t-48: 48px; --t-64: 64px;

  --easing: cubic-bezier(.2,.7,.2,1);
  --dur-fast: 120ms;
  --dur: 200ms;
  --dur-slow: 320ms;

  --max-w: 1200px;
}

/* =========================================================================
   Reset & base
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--font-text); color: var(--fg-1); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; line-height: 1.4; background: var(--surface); }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; font: inherit; border: 0; background: none; color: inherit; }
img { max-width: 100%; display: block; }
ul { list-style: none; }
input, select, textarea { font: inherit; }
::selection { background: var(--orange-200); color: var(--fg-1); }

/* =========================================================================
   HEADER + NAV
   ========================================================================= */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border-1);
}
.header-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--s-6);
  display: flex; align-items: center; gap: var(--s-4);
  height: 64px;
}
.logo {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-family: var(--font-display);
  font-weight: 800; font-size: var(--t-18);
  color: var(--fg-1);
  white-space: nowrap; cursor: pointer;
}
.logo .logo-img {
  height: 32px;
  width: auto;
}
.logo .logo-img svg { height: 100%; width: auto; display: block; }
.logo .logo-suffix {
  font-family: var(--font-text);
  font-size: var(--t-13);
  color: var(--fg-3);
  font-weight: 500;
  margin-left: 2px;
}
.header-search { flex: 1; max-width: 420px; position: relative; }
.header-search .silpo-input { padding: 10px var(--s-4); font-size: var(--t-14); }
.header-right {
  display: flex; align-items: center; gap: var(--s-4);
  margin-left: auto;
  font-size: var(--t-14); color: var(--fg-2);
}
.header-right .user {
  display: flex; align-items: center; gap: var(--s-2);
  padding: 6px 10px 6px 6px;
  border-radius: var(--r-pill);
  transition: background var(--dur) var(--easing);
  cursor: pointer;
}
.header-right .user:hover { background: var(--black-4); }
.header-right .user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--orange-500); color: #fff;
  display: grid; place-items: center;
  font-weight: 700; font-size: var(--t-13);
}

/* Sub-nav */
.nav { background: var(--surface); border-bottom: 1px solid var(--border-1); }
.nav-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--s-6);
  display: flex; gap: var(--s-1);
  overflow-x: auto;
}
.nav a, .nav .nav-link {
  display: block;
  padding: var(--s-4) var(--s-4);
  font-size: var(--t-14); font-weight: 600;
  color: var(--fg-2);
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color var(--dur) var(--easing);
  cursor: pointer;
}
.nav a:hover, .nav .nav-link:hover { color: var(--fg-1); }
.nav a.active, .nav .nav-link.active { color: var(--fg-1); border-bottom-color: var(--orange-500); }

/* =========================================================================
   BUTTONS
   ========================================================================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px;
  font-family: var(--font-text);
  font-weight: 700;
  font-size: var(--t-14);
  line-height: 1;
  padding: 13px 22px;
  border-radius: var(--r-pill);
  border: 0;
  cursor: pointer;
  transition: background var(--dur) var(--easing), color var(--dur) var(--easing);
}
.btn-lg { padding: 16px 28px; font-size: var(--t-16); }
.btn-sm { padding: 9px 16px; font-size: var(--t-13); }
.btn-xs { padding: 6px 12px; font-size: var(--t-12); }
.btn-primary { background: var(--blue-500); color: #fff; }
.btn-primary:hover { background: var(--blue-600); }
.btn-primary:active { background: var(--blue-700); }
.btn-primary:focus-visible { box-shadow: var(--shadow-focus); outline: none; }
.btn-brand { background: var(--orange-500); color: #fff; }
.btn-brand:hover { background: var(--orange-600); }
.btn-brand:active { background: var(--orange-700); }
.btn-tert { background: var(--blue-100); color: var(--blue-700); }
.btn-tert:hover { background: var(--blue-200); }
.btn-stroked { background: transparent; color: var(--blue-500); box-shadow: inset 0 0 0 1px var(--blue-500); }
.btn-stroked:hover { background: var(--blue-100); }
.btn-ghost { background: transparent; color: var(--fg-1); }
.btn-ghost:hover { background: var(--black-6); }
.btn-dark { background: var(--fg-1); color: #fff; }
.btn-dark:hover { background: #000; }
.btn-light { background: #fff; color: var(--fg-1); box-shadow: inset 0 0 0 1px var(--border-2); }
.btn-light:hover { background: var(--black-4); }
.btn:disabled { background: var(--black-12); color: var(--white-87); cursor: not-allowed; }

/* =========================================================================
   INPUTS
   ========================================================================= */
.silpo-input {
  background: var(--surface-2);
  border-radius: var(--r-16);
  padding: 12px var(--s-4);
  display: flex; align-items: center; gap: 10px;
  color: var(--fg-1);
  font-size: var(--t-16);
  width: 100%;
  border: 0;
  box-shadow: inset 0 0 0 1px transparent;
  transition: box-shadow var(--dur) var(--easing), background var(--dur) var(--easing);
}
.silpo-input input,
.silpo-input select,
input.silpo-input,
select.silpo-input,
textarea.silpo-input {
  flex: 1; min-width: 0;
  background: transparent;
  border: 0; outline: none;
  font-size: inherit; color: inherit;
  font-family: inherit;
  text-overflow: ellipsis;
}
.silpo-input::placeholder, .silpo-input input::placeholder { color: var(--black-60); }
.silpo-input:focus-within,
input.silpo-input:focus,
select.silpo-input:focus,
textarea.silpo-input:focus {
  background: #fff;
  box-shadow: inset 0 0 0 2px var(--blue-500);
  outline: none;
}
.silpo-input.error { background: #fff; box-shadow: inset 0 0 0 2px var(--red-500); }
.silpo-input svg { width: 20px; height: 20px; color: var(--black-60); flex-shrink: 0; }
textarea.silpo-input { min-height: 96px; resize: vertical; line-height: 1.4; }

/* =========================================================================
   CHIPS / PILLS
   ========================================================================= */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  border-radius: var(--r-pill);
  font-size: var(--t-13); font-weight: 600;
  background: var(--surface-3);
  color: var(--fg-1);
  cursor: pointer;
  transition: background var(--dur) var(--easing), color var(--dur) var(--easing);
  border: 0;
}
.chip:hover { background: var(--neutral-200); }
.chip.on { background: var(--blue-500); color: #fff; }
.chip.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--border-2); }

/* =========================================================================
   TAGS
   ========================================================================= */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px;
  border-radius: var(--r-8);
  font-size: var(--t-12);
  font-weight: 700;
}
.tag-shop      { background: var(--orange-100); color: var(--orange-900); }
.tag-warehouse { background: var(--blue-100);   color: var(--blue-700); }
.tag-office    { background: var(--violet-100); color: var(--violet-700); }
.tag-courier   { background: var(--pink-100);   color: var(--pink-700); }

/* Hot sticker */
.sticker {
  position: relative;
  display: inline-flex; align-items: center;
  background: var(--pink-500); color: #fff;
  font-weight: 800; font-size: var(--t-12);
  padding: 5px 10px 5px 16px;
  border-radius: 0 6px 6px 0;
}
.sticker::before {
  content: ''; position: absolute;
  left: -1px; top: 50%; transform: translateY(-50%);
  width: 10px; height: 10px;
  background: #fff;
  border-radius: 50%;
}
.sticker.orange { background: var(--orange-500); }
.sticker.green  { background: var(--green-500); }
.sticker.violet { background: var(--violet-500); }

/* Badge */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px;
  border-radius: var(--r-8);
  font-size: var(--t-12); font-weight: 600;
  background: var(--surface-3);
  color: var(--fg-2);
}
.badge.brand { background: var(--orange-100); color: var(--orange-900); }
.badge.blue  { background: var(--blue-100); color: var(--blue-700); }
.badge.success { background: var(--green-100); color: var(--green-700); }

/* =========================================================================
   SECTION / TILE helpers
   ========================================================================= */
.section {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: var(--s-12) var(--s-6);
}
.section-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--t-32);
  line-height: 1.2;
  letter-spacing: -0.005em;
  color: var(--fg-1);
  margin-bottom: var(--s-5);
}
.section-header {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: var(--s-5); gap: var(--s-3); flex-wrap: wrap;
}
.section-header .link-all {
  color: var(--blue-500);
  font-weight: 600;
  font-size: var(--t-14);
  display: inline-flex; align-items: center; gap: 4px;
  cursor: pointer;
}
.section-header .link-all:hover { color: var(--blue-700); }
.tile {
  background: #fff;
  border-radius: var(--r-16);
  box-shadow: var(--shadow-volume), 0 0 0 1px var(--black-6);
  transition: box-shadow var(--dur) var(--easing);
}

/* Tint helpers */
.tint-orange  { background: var(--orange-100); }
.tint-blue    { background: var(--blue-100); }
.tint-green   { background: var(--green-100); }
.tint-violet  { background: var(--violet-100); }
.tint-pink    { background: var(--pink-100); }
.tint-yellow  { background: var(--yellow-100); }
.tint-lblue   { background: var(--lblue-100); }
.tint-neutral { background: var(--neutral-100); }

/* =========================================================================
   VACANCY CARD
   ========================================================================= */
.vacancy-card {
  background: #fff;
  border-radius: var(--r-16);
  box-shadow: var(--shadow-volume), 0 0 0 1px var(--black-6);
  padding: var(--s-5);
  transition: box-shadow var(--dur) var(--easing);
  cursor: pointer;
  display: flex; flex-direction: column; gap: var(--s-2);
}
.vacancy-card:hover { box-shadow: var(--shadow-volume), 0 0 0 1px var(--black-24); }
.vacancy-card .vc-head { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.vacancy-card .vc-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--t-18);
  color: var(--fg-1);
  line-height: 1.3;
}
.vacancy-card .vc-location {
  font-size: var(--t-13);
  color: var(--fg-2);
  display: flex; align-items: center; gap: 4px;
}
.vacancy-card .vc-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.vacancy-card .vc-salary {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--t-20);
  color: var(--fg-1);
}
.vacancy-card .vc-salary .currency { font-size: var(--t-14); color: var(--fg-3); margin-left: 2px; }
.vacancy-card .vc-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.vacancy-card .vc-date { font-size: var(--t-12); color: var(--fg-3); }

/* =========================================================================
   AUTOSUGGEST
   ========================================================================= */
.autosuggest{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border-2);border-radius:var(--r-16);margin-top:4px;box-shadow:var(--shadow-elev);z-index:200;max-height:360px;overflow-y:auto;display:none}
.autosuggest.open{display:block}
.autosuggest-item{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);cursor:pointer;transition:background var(--dur-fast) var(--easing);border-bottom:1px solid var(--border-1)}
.autosuggest-item:last-child{border-bottom:none}
.autosuggest-item:hover,.autosuggest-item.selected{background:var(--blue-50)}
.autosuggest-item .as-icon{width:36px;height:36px;border-radius:var(--r-12);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.autosuggest-item .as-info{flex:1;min-width:0}

.autosuggest-item .as-salary{font-size:var(--t-13);font-weight:700;color:var(--blue-500);white-space:nowrap;flex-shrink:0}
.autosuggest-hint{padding:var(--s-3) var(--s-4);font-size:var(--t-12);color:var(--fg-3);text-align:center}
.autosuggest-item .as-count{font-size:var(--t-12);color:var(--fg-3);white-space:nowrap;flex-shrink:0}
.autosuggest-city .autosuggest-item .as-icon{font-size:14px;width:32px;height:32px;border-radius:50%}
.autosuggest-city{min-width:260px;right:0}
.search-wrap{position:relative;z-index:1}
.search-wrap:focus-within,.search-wrap:has(.autosuggest.open){z-index:9999}

/* =========================================================================
   HERO
   ========================================================================= */
.hero {
  background: var(--orange-500);
  color: #fff;
  position: relative;
}
.hero::after {
  content: '';
  position: absolute;
  right: -120px; bottom: -120px;
  width: 360px; height: 360px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
}
.hero::before {
  content: '';
  position: absolute;
  left: 60%; top: -80px;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: rgba(255,255,255,.06);
}
.hero-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: var(--s-12) var(--s-6) var(--s-16);
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: var(--s-10);
  align-items: center;
  position: relative; z-index: 1;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: var(--s-2);
  background: rgba(255,255,255,.16);
  backdrop-filter: blur(24px);
  padding: 6px 14px;
  border-radius: var(--r-pill);
  font-size: var(--t-12);
  font-weight: 600;
  margin-bottom: var(--s-4);
}
.hero h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 56px;
  line-height: 1.05;
  letter-spacing: -0.01em;
  color: #fff;
  margin-bottom: var(--s-4);
}
.hero p.lead {
  font-size: var(--t-18);
  color: var(--white-87);
  line-height: 1.4;
  margin-bottom: var(--s-6);
  max-width: 540px;
}
.hero-cta-row{display:flex;align-items:center;gap:var(--s-5);margin-bottom:var(--s-6);flex-wrap:wrap}
.hero-cta-btn{display:inline-flex;align-items:center;gap:var(--s-2);background:#fff;color:var(--orange-600);font-family:var(--font-display);font-weight:800;font-size:var(--t-18);padding:14px 28px;border-radius:var(--r-pill);border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.15);transition:transform var(--dur) var(--easing),box-shadow var(--dur) var(--easing)}
.hero-cta-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.hero-cta-arrow{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--orange-500);color:#fff;font-size:18px;margin-left:4px}
.hero-cta-hint{display:inline-flex;align-items:center;gap:6px;color:var(--white-87);font-size:var(--t-14);font-weight:500}
.green-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;flex-shrink:0}
.hero-search {
  display: flex; gap: var(--s-2);
  background: #fff;
  padding: 8px;
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-volume);
  max-width: 580px;
  position: relative; z-index: 50;
}
.hero-quicklinks { position: relative; z-index: 1; }
.hero-stats { position: relative; z-index: 1; }
.hero-search .silpo-input {
  background: transparent;
  flex: 1;
  padding: 10px var(--s-4);
  font-size: var(--t-16);
  color: var(--fg-1);
}
.hero-search .silpo-input:focus-within { background: var(--surface-2); }
.hero-search .silpo-input.divider { box-shadow: -1px 0 0 0 var(--border-1); border-radius: 0; max-width: 180px; }
.hero-quicklinks {
  display: flex; gap: var(--s-2); flex-wrap: wrap;
  margin-top: var(--s-4);
}
.hero-quicklinks a, .hero-quicklinks button {
  font-size: var(--t-13); color: var(--white-72);
  padding: 4px 10px;
  border-radius: var(--r-pill);
  background: rgba(255,255,255,.12);
  border: 0; cursor: pointer;
}
.hero-quicklinks a:hover, .hero-quicklinks button:hover { background: rgba(255,255,255,.22); color: #fff; }
.hero-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: var(--s-3);
}
.hero-stat {
  background: rgba(255,255,255,.16);
  backdrop-filter: blur(24px);
  border-radius: var(--r-20);
  padding: var(--s-5);
}
.hero-stat .v {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--t-32);
  line-height: 1;
  margin-bottom: 4px;
}
.hero-stat .l {
  font-size: var(--t-12);
  color: var(--white-72);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

/* =========================================================================
   CATEGORIES (Home)
   ========================================================================= */
.cats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s-4);
}
.cat-tile-sm {
  background: #fff;
  border-radius: var(--r-16);
  box-shadow: var(--shadow-volume), 0 0 0 1px var(--black-6);
  padding: var(--s-5);
  cursor: pointer;
  transition: box-shadow var(--dur) var(--easing);
  display: flex;
  flex-direction: column;
}
.cat-tile-sm:hover { box-shadow: var(--shadow-volume), 0 0 0 1px var(--black-24); }
.cat-tile-sm .emoji-tile {
  width: 56px; height: 56px;
  border-radius: var(--r-16);
  margin-bottom: var(--s-3);
  display: grid; place-items: center;
  font-size: 28px;
}
.cat-tile-sm h3 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--t-20);
  margin-bottom: var(--s-2);
}
.cat-tile-sm .cat-jobs {
  font-size: var(--t-13);
  color: var(--fg-2);
  line-height: 1.5;
  flex: 1;
  margin-bottom: var(--s-4);
}
.cat-tile-sm .cat-foot {
  display: flex;
  justify-content: space-between;

}
.cat-tile-sm .cat-foot .cnt {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--t-14);
  color: var(--fg-1);
}
.cat-tile-sm .cat-foot .cat-arrow {
  width: 36px; height: 36px;
  border-radius: var(--r-pill);
  background: var(--green-500);
  color: #fff;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.cat-tile-sm .cat-foot .cat-arrow svg { width: 18px; height: 18px; }

/* =========================================================================
   HOT VACANCIES (Home)
   ========================================================================= */
.hot-filters {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: var(--s-5);
}
.hot-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s-4);
}

/* =========================================================================
   COURIER STRIPE (Home)
   ========================================================================= */
.courier-stripe-card {
  background: var(--fg-1);
  color: #fff;
  border-radius: var(--r-24);
  padding: var(--s-10);
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: var(--s-8);
  align-items: center;
}
.courier-stripe-card::after {
  content: '';
  position: absolute;
  right: -40px; bottom: -60px;
  font-size: 280px; line-height: 1;
  opacity: 0.08;
}
.courier-stripe-card .eyebrow {
  color: var(--orange-400);
  font-size: var(--t-12);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: var(--s-3);
}
.courier-stripe-card h2 {
  font-family: var(--font-display);
  font-size: var(--t-32);
  font-weight: 800;
  line-height: 1.15;
  margin-bottom: var(--s-3);
  color: #fff;
}
.courier-stripe-card p {
  color: var(--white-72);
  margin-bottom: var(--s-5);
  font-size: var(--t-16);
  max-width: 520px;
}
.courier-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: var(--s-3);
  position: relative; z-index: 1;
}
.courier-stat {
  background: var(--white-8);
  border-radius: var(--r-16);
  padding: var(--s-4);
}
.courier-stat .v {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--t-24);
  color: var(--orange-400);
  margin-bottom: 2px;
}
.courier-stat .l {
  font-size: var(--t-12);
  color: var(--white-60);
  font-weight: 600;
}

/* =========================================================================
   BENEFITS (Home)
   ========================================================================= */
.benefits-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--s-3);
}
.benefit-card {
  background: #fff;
  border-radius: var(--r-16);
  box-shadow: var(--shadow-volume), 0 0 0 1px var(--black-6);
  padding: var(--s-5);
}
.benefit-card .b-icon {
  width: 48px; height: 48px;
  border-radius: var(--r-12);
  display: grid; place-items: center;
  font-size: 24px;
  margin-bottom: var(--s-3);
}
.benefit-card h4 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--t-16);
  margin-bottom: 4px;
}
.benefit-card p { font-size: var(--t-13); color: var(--fg-2); line-height: 1.4; }

/* =========================================================================
   STEPS (Home)
   ========================================================================= */
.steps-section { background: var(--surface-2); }
.steps-wrap {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: var(--s-12) var(--s-6);
}
.steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--s-4);
  position: relative;
}
.step { text-align: center; position: relative; }
.step::after {
  content: '';
  position: absolute;
  top: 32px;
  left: calc(50% + 36px);
  right: calc(-50% + 36px);
  height: 2px;
  background: var(--border-2);
}
.step:last-child::after { display: none; }
.step .num {
  width: 64px; height: 64px;
  border-radius: var(--r-pill);
  background: var(--orange-500);
  color: #fff;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--t-24);
  margin: 0 auto var(--s-3);
  display: grid; place-items: center;
  position: relative; z-index: 1;
  box-shadow: var(--shadow-volume);
}
.step h4 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--t-18);
  margin-bottom: 4px;
}
.step p { font-size: var(--t-13); color: var(--fg-2); max-width: 220px; margin: 0 auto; }

/* =========================================================================
   TESTIMONIALS (Home)
   ========================================================================= */
.test-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--s-4);
}
.test-card {
  background: #fff;
  border-radius: var(--r-16);
  box-shadow: var(--shadow-volume), 0 0 0 1px var(--black-6);
  padding: var(--s-6);
  display: flex; flex-direction: column;
  gap: var(--s-4);
}
.test-card .quote {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--t-18);
  line-height: 1.4;
  color: var(--fg-1);
}
.test-card .author { display: flex; gap: var(--s-3); align-items: center; }
.test-card .author .ava {
  width: 48px; height: 48px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--t-18);
  color: var(--fg-1);
  flex-shrink: 0;
}
.test-card .author .a-name { font-weight: 700; font-size: var(--t-14); }
.test-card .author .a-role { font-size: var(--t-12); color: var(--fg-3); }

/* =========================================================================
   FAQ (Home)
   ========================================================================= */
.faq-section { max-width: 800px; margin: 0 auto; padding: var(--s-12) var(--s-6); }
.faq-list { display: flex; flex-direction: column; gap: var(--s-2); }
.faq-item {
  background: #fff;
  border-radius: var(--r-16);
  box-shadow: var(--shadow-volume), 0 0 0 1px var(--black-6);
  padding: var(--s-5);
  cursor: pointer;
  transition: box-shadow var(--dur) var(--easing);
}
.faq-item:hover { box-shadow: var(--shadow-volume), 0 0 0 1px var(--black-24); }
.faq-q {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--t-18);
  color: var(--fg-1);
  gap: var(--s-3);
}
.faq-q .icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--surface-2);
  display: grid; place-items: center;
  font-size: 18px; font-weight: 700;
  color: var(--fg-3);
  transition: transform var(--dur) var(--easing), background var(--dur) var(--easing);
  flex-shrink: 0;
}
.faq-item.open .faq-q .icon {
  background: var(--blue-500);
  color: #fff;
  transform: rotate(45deg);
}
.faq-a {
  max-height: 0;
  overflow: hidden;
  font-size: var(--t-14);
  color: var(--fg-2);
  line-height: 1.6;
  transition: max-height var(--dur-slow) var(--easing), padding var(--dur-slow) var(--easing);
}
.faq-item.open .faq-a {
  max-height: 280px;
  padding-top: var(--s-3);
}

/* FINAL CTA */
.final-cta-card {
  background: var(--surface-2);
  border-radius: var(--r-24);
  padding: var(--s-12);
  text-align: center;
}
.final-cta-card h2 {
  font-family: var(--font-display);
  font-size: var(--t-32);
  font-weight: 800;
  margin-bottom: var(--s-2);
  letter-spacing: -0.005em;
}
.final-cta-card p { color: var(--fg-2); margin-bottom: var(--s-5); font-size: var(--t-16); }
.final-cta-card .ctas { display: inline-flex; gap: var(--s-2); flex-wrap: wrap; justify-content: center; }

/* =========================================================================
   VACANCIES PAGE (Catalog)
   ========================================================================= */
.cat-wrap { max-width: var(--max-w); margin: 0 auto; padding: var(--s-8) var(--s-6) var(--s-12); }
.cat-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--s-3); flex-wrap: wrap; gap: var(--s-3); }
.cat-head h1 {
  font-family: var(--font-display); font-weight: 800;
  font-size: var(--t-32); letter-spacing: -0.005em;
}
.cat-count { font-size: var(--t-14); color: var(--fg-2); }
.cat-count strong { color: var(--blue-500); font-weight: 700; }
.cat-search-row {
  display: grid;
  grid-template-columns: 1fr 240px auto;
  gap: var(--s-3);
  margin-bottom: var(--s-5);
}
.cat-layout { display: grid; grid-template-columns: 280px 1fr; gap: var(--s-6); align-items: flex-start; }

/* Quick filters */
.quick-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--s-5); }

/* Filters sidebar */
.filters {
  position: sticky; top: 80px;
  background: #fff;
  border-radius: var(--r-16);
  box-shadow: var(--shadow-volume), 0 0 0 1px var(--black-6);
  padding: var(--s-5);
}
.filters h3 {
  font-family: var(--font-display);
  font-size: var(--t-18);
  font-weight: 700;
  margin-bottom: var(--s-3);
  display: flex; justify-content: space-between; align-items: center;
}
.filters h3 .reset { font-family: var(--font-text); font-size: var(--t-12); color: var(--red-600); font-weight: 600; cursor: pointer; }
.filter-group { border-top: 1px solid var(--border-1); padding: var(--s-4) 0; }
.filter-group:first-of-type { border-top: 0; padding-top: 0; }
.filter-group .fg-head {
  font-family: var(--font-text); font-weight: 700;
  font-size: var(--t-14);
  margin-bottom: var(--s-2);
}
.filter-row {
  display: flex; align-items: center; gap: var(--s-2);
  padding: 6px 0;
  font-size: var(--t-14);
  cursor: pointer;
}
.filter-row input[type=checkbox] { accent-color: var(--blue-500); width: 16px; height: 16px; }
.filter-row .cnt { margin-left: auto; font-size: var(--t-12); color: var(--fg-3); }
.salary-slider-wrap { padding: 4px 0; }
.salary-slider-vals { display: flex; justify-content: space-between; font-size: var(--t-13); font-weight: 600; color: var(--fg-1); margin-bottom: 12px; }
.salary-slider-vals span { background: var(--blue-50); padding: 4px 10px; border-radius: var(--r-pill); color: var(--blue-600); font-family: var(--font-display); }
.dual-range { position: relative; height: 6px; margin: 8px 0 4px; }
.dual-range .track { position: absolute; top: 0; left: 0; right: 0; height: 6px; border-radius: 3px; background: var(--surface-3); }
.dual-range .track-fill { position: absolute; top: 0; height: 6px; background: var(--blue-500); border-radius: 3px; }
.dual-range input[type=range] {
  position: absolute; top: -7px; width: 100%; height: 20px;
  -webkit-appearance: none; appearance: none;
  background: transparent; pointer-events: none; margin: 0;
}
.dual-range input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 3px var(--blue-500), var(--shadow-volume);
  cursor: pointer; pointer-events: auto;
}
.dual-range input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 3px var(--blue-500), var(--shadow-volume);
  cursor: pointer; pointer-events: auto; border: 0;
}
.salary-slider-marks { display: flex; justify-content: space-between; font-size: var(--t-12); color: var(--fg-3); margin-top: 6px; }
.filter-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-apply-btn { display: none; }

/* Active filter pills */
.active-filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: var(--s-4); }
.af-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  border-radius: var(--r-pill);
  background: var(--blue-100);
  color: var(--blue-700);
  font-size: var(--t-13);
  font-weight: 600;
}
.af-pill .x { cursor: pointer; font-weight: 800; }

/* Sort row */
.sort-row { display: inline-flex; align-items: center; gap: var(--s-2); font-size: var(--t-13); color: var(--fg-2); }
.sort-row select.silpo-input { padding: 8px 14px; font-size: var(--t-13); width: auto; border-radius: var(--r-pill); background: var(--surface-2); }

/* Results grid */
.results-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: var(--s-3);
}
.results-grid.list { grid-template-columns: 1fr; }

/* Pagination */
.pagination {
  display: flex; justify-content: center; align-items: center;
  gap: 6px; margin-top: var(--s-8);
}
.pagination button {
  min-width: 40px; height: 40px;
  border-radius: var(--r-pill);
  font-weight: 600;
  font-size: var(--t-14);
  color: var(--fg-1);
  background: transparent;
  padding: 0 12px;
  transition: background var(--dur) var(--easing);
}
.pagination button:hover { background: var(--surface-2); }
.pagination button.active { background: var(--blue-500); color: #fff; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

/* No results */
.no-results { text-align: center; padding: var(--s-12); color: var(--fg-3); grid-column: 1 / -1; }

/* =========================================================================
   DETAIL PAGE
   ========================================================================= */
.detail-wrap { max-width: var(--max-w); margin: 0 auto; padding: var(--s-6) var(--s-6) var(--s-12); }
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--blue-500); font-weight: 600; font-size: var(--t-14);
  margin-bottom: var(--s-5); padding: 4px 0; cursor: pointer;
}
.detail-grid { display: grid; grid-template-columns: 1fr 360px; gap: var(--s-8); align-items: flex-start; }
.detail-head { margin-bottom: var(--s-5); }
.detail-tags { display: flex; gap: 6px; margin-bottom: var(--s-3); flex-wrap: wrap; }
.detail-head h1 {
  font-family: var(--font-display); font-weight: 800;
  font-size: var(--t-42); line-height: 1.1;

// ============ APP ============
const App = {
  currentPage: 'home',
  filters: {cities:[],employment:[],experience:[],salaryFrom:null,salaryTo:null,schedule:[],search:'',category:'',sort:'relevance'},
  vacPage: 1,
  perPage: 9,
  hotCity: 'Всі',

  _skipPush: false,

  init() {
    this.bindNav();
    window.addEventListener('popstate', (e) => {
      if (e.state) {
        this._skipPush = true;
        this.filters = e.state.filters ? JSON.parse(JSON.stringify(e.state.filters)) : this.filters;
        this.vacPage = e.state.vacPage || 1;
        this.hotCity = e.state.hotCity || 'Всі';
        this.renderPage(e.state.page, e.state.data);
        this._skipPush = false;
      }
    });
    const hash = location.hash.replace('#','');
    if (hash.startsWith('detail/')) {
      const id = hash.split('/')[1];
      this.navigate('detail', id);
    } else {
      const startPage = hash && ['home','vacancies','courier','about'].includes(hash) ? hash : 'home';
      this.navigate(startPage);
    }
    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) this.closeModal();
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.search-wrap')) {
        document.querySelectorAll('.autosuggest').forEach(el => {
          el.classList.remove('open'); el.innerHTML = '';
        });
      }
    });
  },

  bindNav() {
    document.querySelectorAll('#mainNav a').forEach(a => {
      a.addEventListener('click', () => this.navigate(a.dataset.page));
    });
  },

  navigate(page, data) {
    if (!this._skipPush) {
      const state = {
        page,
        data: data || null,
        filters: JSON.parse(JSON.stringify(this.filters)),
        vacPage: this.vacPage,
        hotCity: this.hotCity
      };
      const hash = '#' + page + (data ? '/' + data : '');
      history.pushState(state, '', hash);
    }
    this.renderPage(page, data);
  },

  renderPage(page, data) {
    this.currentPage = page;
    document.querySelectorAll('#mainNav a').forEach(a => {
      a.classList.toggle('active', a.dataset.page === page);
    });
    window.scrollTo(0, 0);
    const app = document.getElementById('app');
    switch(page) {
      case 'home': app.innerHTML = this.renderHome(); this.bindHome(); break;
      case 'vacancies': app.innerHTML = this.renderVacancies(); this.bindVacancies(); break;
      case 'detail': app.innerHTML = this.renderDetail(data); this.bindDetail(); break;
      case 'courier': app.innerHTML = this.renderCourier(); this.bindCourier(); break;
      case 'calculator': app.innerHTML = this.renderCalculator(); this.bindCalculator(); break;
      case 'stories': app.innerHTML = this.renderStories(); this.bindStories(); break;
      case 'about': app.innerHTML = this.renderAbout(); break;
    }
  },

  // ============ FILTERING ============
  getFiltered() {
    let list = [...VACANCIES];
    const f = this.filters;
    if (f.search) {
      const s = f.search.toLowerCase();
      list = list.filter(v => v.title.toLowerCase().includes(s) || v.location.toLowerCase().includes(s) || v.category.toLowerCase().includes(s));
    }
    if (f.category) list = list.filter(v => v.category === f.category);
    if (f.cities.length) list = list.filter(v => f.cities.includes(v.city));
    if (f.employment.length) list = list.filter(v => f.employment.some(e => v.employment.includes(e)));
    if (f.experience.length) list = list.filter(v => {
      return f.experience.some(e => {
        if (e === 'none') return v.experience === 'none';
        if (e === '1year') return v.experience === '1year';
        if (e === '3years') return v.experience === '3years';
        return false;
      });
    });
    if (f.salaryFrom) list = list.filter(v => v.salary >= f.salaryFrom);
    if (f.salaryTo) list = list.filter(v => v.salary <= f.salaryTo);
    if (f.schedule.length) list = list.filter(v => f.schedule.includes(v.schedule));
    if (f.sort === 'date') list.sort((a,b) => new Date(b.date)-new Date(a.date));
    else if (f.sort === 'salaryUp') list.sort((a,b) => a.salary-b.salary);
    else if (f.sort === 'salaryDown') list.sort((a,b) => b.salary-a.salary);
    return list;
  },

  searchFromHeader() {
    const val = document.getElementById('headerSearch').value.trim();
    this.closeSuggest('headerSuggest');
    this.filters.search = val;
    this.vacPage = 1;
    this.navigate('vacancies');
  },

  // ============ AUTOSUGGEST ============
  _suggestIdx: -1,

  buildSuggestResults(query) {
    if (!query || query.length < 3) return [];
    const q = query.toLowerCase();
    const tokens = q.split(/\s+/).filter(t => t.length > 0);
    const scored = VACANCIES.map(v => {
      const title = v.title.toLowerCase();
      let score = 0;
      if (title.includes(q)) score += 100;
      tokens.forEach(t => { if (title.includes(t)) score += 30; });
      const words = title.split(/\s+/);
      tokens.forEach(t => { words.forEach(w => { if (w.startsWith(t)) score += 20; }); });
      return { vacancy: v, score };
    }).filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 7);
    return scored.map(x => x.vacancy);
  },

  highlightMatch(text, query) {
    if (!query || query.length < 3) return text;
    const tokens = query.toLowerCase().split(/\s+/).filter(t => t.length > 0);
    let result = text;
    tokens.forEach(t => {
      const regex = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      result = result.replace(regex, '<mark>$1</mark>');
    });
    return result;
  },

  renderSuggest(results, query, suggestId) {
    if (!results.length) {
      return '<div class="autosuggest-hint">Нічого не знайдено</div>';
    }
    const catIcons = {'Магазин':'🏪','Склад':'📦','Офіс':'🏢','Кур\'єр':'🛵'};
    return results.map((v, i) => `
      <div class="autosuggest-item${i === this._suggestIdx ? ' selected' : ''}"
        onmousedown="App.selectSuggest('${v.id}','${suggestId}')"
        onmouseenter="App._suggestIdx=${i};App.updateSuggestHighlight('${suggestId}')">
        <div class="as-icon">${catIcons[v.category]||'📋'}</div>
        <div class="as-info">
          <div class="as-title">${this.highlightMatch(v.title, query)}</div>
          <div class="as-meta"><span>📍 ${v.city}</span><span>${v.category}</span></div>
        </div>
        <div class="as-salary">від ${v.salary.toLocaleString('uk')} ₴</div>
      </div>
    `).join('');
  },

  onSearchInput(input, suggestId) {
    const q = input.value.trim();
    const el = document.getElementById(suggestId);
    if (!el) return;
    this._suggestIdx = -1;
    if (q.length < 3) {
      el.classList.remove('open');
      el.innerHTML = '';
      return;
    }
    const results = this.buildSuggestResults(q);
    el.innerHTML = this.renderSuggest(results, q, suggestId);
    el.classList.add('open');
    this._currentSuggestResults = results;
    this._currentSuggestId = suggestId;
  },

  onSearchKeydown(e, suggestId) {
    const el = document.getElementById(suggestId);
    if (!el || !el.classList.contains('open')) {
      if (e.key === 'Enter') {
        this.doFullSearch(e.target);
      }
      return;
    }
    const results = this._currentSuggestResults || [];
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      this._suggestIdx = Math.min(this._suggestIdx + 1, results.length - 1);
      this.updateSuggestHighlight(suggestId);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      this._suggestIdx = Math.max(this._suggestIdx - 1, -1);
      this.updateSuggestHighlight(suggestId);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (this._suggestIdx >= 0 && results[this._suggestIdx]) {
        this.selectSuggest(results[this._suggestIdx].id, suggestId);
      } else {
        this.closeSuggest(suggestId);
        this.doFullSearch(e.target);
      }
    } else if (e.key === 'Escape') {
      this.closeSuggest(suggestId);
    }
  },

  updateSuggestHighlight(suggestId) {
    const el = document.getElementById(suggestId);
    if (!el) return;
    el.querySelectorAll('.autosuggest-item').forEach((item, i) => {
      item.classList.toggle('selected', i === this._suggestIdx);
    });
    const sel = el.querySelector('.autosuggest-item.selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  },

  selectSuggest(vacId, suggestId) {
    this.closeSuggest(suggestId);
    this.navigate('detail', vacId);
  },

  closeSuggest(suggestId) {
    const el = document.getElementById(suggestId);
    if (el) { el.classList.remove('open'); el.innerHTML = ''; }
    this._suggestIdx = -1;
    this._currentSuggestResults = [];
  },

  doFullSearch(input) {
    const val = input.value.trim();
    this.filters.search = val;
    this.vacPage = 1;
    this.navigate('vacancies');
  },

  // ============ CITY AUTOSUGGEST ============
  _cityIdx: -1,
  _cityResults: [],

  buildCityResults(query) {
    const q = query.toLowerCase().trim();
    if (!q) return ALL_CITIES.slice();
    return ALL_CITIES.filter(c => c.toLowerCase().includes(q))
      .sort((a, b) => {
        const aStarts = a.toLowerCase().startsWith(q) ? 0 : 1;
        const bStarts = b.toLowerCase().startsWith(q) ? 0 : 1;
        return aStarts - bStarts || a.localeCompare(b, 'uk');
      });
  },

  getCityVacCount(city) {
    return VACANCIES.filter(v => v.city === city).length;
  },

  renderCitySuggest(results, query, suggestId) {
    if (!results.length) return '<div class="autosuggest-hint">Місто не знайдено</div>';
    return results.map((city, i) => {
      const highlighted = query ? this.highlightMatch(city, query) : city;
      const cnt = this.getCityVacCount(city);
      return `<div class="autosuggest-item${i === this._cityIdx ? ' selected' : ''}"
        onmousedown="App.selectCity('${city}','${suggestId}')"
        onmouseenter="App._cityIdx=${i};App.updateCityHighlight('${suggestId}')">
        <div class="as-icon">📍</div>
        <div class="as-info"><div class="as-title">${highlighted}</div></div>
        ${cnt ? `<div class="as-count">${cnt} вакансій</div>` : '<div class="as-count" style="color:var(--fg-4)">—</div>'}
      </div>`;
    }).join('');
  },

  onCityInput(input, suggestId) {
    const q = input.value.trim();
    this._cityIdx = -1;
    const results = this.buildCityResults(q);
    this._cityResults = results;
    const el = document.getElementById(suggestId);
    if (!el) return;
    el.innerHTML = this.renderCitySuggest(results, q, suggestId);
    el.classList.add('open');
  },

  onCityFocus(input, suggestId) {
    this.onCityInput(input, suggestId);
  },

  onCityKeydown(e, input, suggestId) {
    const el = document.getElementById(suggestId);
    if (!el || !el.classList.contains('open')) return;
    const results = this._cityResults;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      this._cityIdx = Math.min(this._cityIdx + 1, results.length - 1);
      this.updateCityHighlight(suggestId);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      this._cityIdx = Math.max(this._cityIdx - 1, -1);
      this.updateCityHighlight(suggestId);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (this._cityIdx >= 0 && results[this._cityIdx]) {
        this.selectCity(results[this._cityIdx], suggestId);
      } else if (results.length === 1) {
        this.selectCity(results[0], suggestId);
      } else {
        el.classList.remove('open');
      }
    } else if (e.key === 'Escape') {
      el.classList.remove('open');
    }
  },

  updateCityHighlight(suggestId) {
    const el = document.getElementById(suggestId);
    if (!el) return;
    el.querySelectorAll('.autosuggest-item').forEach((item, i) => {
      item.classList.toggle('selected', i === this._cityIdx);
    });
    const sel = el.querySelector('.autosuggest-item.selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  },

  selectCity(city, suggestId) {
    const el = document.getElementById(suggestId);
    if (el) {
      const wrap = el.closest('.search-wrap');
      const input = wrap?.querySelector('input');
      if (input) input.value = city;
      el.classList.remove('open');
    }
    this._cityIdx = -1;
    this._cityResults = [];
  },

  bindHome() {
    const inp = document.getElementById('homeSearch');
    if (inp) {
      inp.addEventListener('keydown', e => { if (e.key==='Enter') this.homeSearch(); });
      this._startTypewriter(inp);
    }
  },

  _twTimer: null,
  _startTypewriter(inp) {
    if (this._twTimer) clearTimeout(this._twTimer);
    const words = ['Касир',"Кур'єр",'Збиральник','Кухар','Вантажник','Маркетолог','Комірник','Продавець','Піцайоло','Флорист','Пекар','Кондитер','Охоронець','Сушист','Водій','Frontend'];
    let wi = 0, ci = 0, deleting = false;
    const type = () => {
      if (inp.value || document.activeElement === inp) {
        this._twTimer = setTimeout(type, 800);
        return;
      }
      const w = words[wi];
      if (!deleting) {
        ci++;
        inp.placeholder = w.slice(0, ci);
        if (ci >= w.length) {
          deleting = true;
          this._twTimer = setTimeout(type, 1800);
          return;
        }
        this._twTimer = setTimeout(type, 100);
      } else {
        ci--;
        inp.placeholder = w.slice(0, ci) || '​';
        if (ci <= 0) {
          deleting = false;
          wi = (wi + 1) % words.length;
          this._twTimer = setTimeout(type, 400);
          return;
        }
        this._twTimer = setTimeout(type, 60);
      }
    };
    inp.placeholder = '';
    this._twTimer = setTimeout(type, 600);
  },

  homeSearch() {
    const val = document.getElementById('homeSearch')?.value?.trim() || '';

            <div class="filter-group">
              <div class="fg-head">Категорія</div>
              ${['Магазин','Склад','Офіс','Кур\'єр'].map(c=>`<label class="filter-row"><input type="checkbox" value="${c}" ${f.category===c?'checked':''} onchange="App.toggleCategory('${c}')"> ${c} <span class="cnt">${VACANCIES.filter(v=>v.category===c).length}</span></label>`).join('')}
            </div>
            <div class="filter-group">
              <div class="fg-head">Місто</div>
              ${CITIES.map(c=>`<label class="filter-row"><input type="checkbox" value="${c}" ${f.cities.includes(c)?'checked':''} onchange="App.toggleFilter('cities','${c}')"> ${c} <span class="cnt">${cityCount(c)}</span></label>`).join('')}

                <div class="dual-range" id="salaryRange">

                  <input type="range" min="10000" max="70000" step="1000" value="${f.salaryTo||70000}" id="salaryTo" oninput="App.updateSalarySlider()">

                <select class="silpo-input" id="sortSelect" onchange="App.setSort(this.value)">

              ${paged.length?paged.map(v=>this.renderVacancyCard(v,'fade-in')).join(''):`<div class="no-results"><p style="font-size:48px;margin-bottom:var(--s-4)">🔍</p><p style="font-size:var(--t-16)">За вашим запитом нічого не знайдено</p><p style="margin-top:var(--s-3)"><button class="btn btn-primary" onclick="App.resetFilters()">Скинути фільтри</button></p></div>`}
            </div>
            ${totalPages>1?`<div class="pagination">
              <button ${page<=1?'disabled':''} onclick="App.vacPage=${page-1};App.navigate('vacancies')">‹</button>
              ${Array.from({length:totalPages},(_,i)=>i+1).map(p=>`<button class="${p===page?'active':''}" onclick="App.vacPage=${p};App.navigate('vacancies')">${p}</button>`).join('')}
              <button ${page>=totalPages?'disabled':''} onclick="App.vacPage=${page+1};App.navigate('vacancies')">›</button>

  bindVacancies() {
    const fromEl = document.getElementById('salaryFrom');
    const toEl = document.getElementById('salaryTo');
    if (fromEl && toEl) {
      const min = 10000, max = 70000, range = max - min;
      const left = ((parseInt(fromEl.value) - min) / range) * 100;
      const right = ((parseInt(toEl.value) - min) / range) * 100;
      const fill = document.getElementById('salTrackFill');
      if (fill) { fill.style.left = left + '%'; fill.style.width = (right - left) + '%'; }
    }
  },

  vacCitySearch() {
    const city = document.getElementById('vacCity')?.value?.trim() || '';
    if (city && ALL_CITIES.includes(city)) {
      if (!this.filters.cities.includes(city)) this.filters.cities = [city];
    }
    this.vacPage = 1;
    this.navigate('vacancies');
  },

  _isMobileFiltersOpen() {
    const el = document.getElementById('vacFilters');
    return el && el.classList.contains('open') && window.innerWidth <= 900;
  },

  toggleMobileFilters() {
    const el = document.getElementById('vacFilters');
    const btn = document.querySelector('.filter-apply-btn');
    if (el) {
      el.classList.toggle('open');
      if (btn) btn.classList.toggle('visible', el.classList.contains('open'));
    }
  },

  applyMobileFilters() {
    const el = document.getElementById('vacFilters');
    const btn = document.querySelector('.filter-apply-btn');
    if (el) el.classList.remove('open');
    if (btn) btn.classList.remove('visible');
    this.vacPage = 1;
    this.navigate('vacancies');
  },

  toggleFilter(key, val) {
    const arr = this.filters[key];
    const idx = arr.indexOf(val);
    if (idx>=0) arr.splice(idx,1); else arr.push(val);
    this.vacPage = 1;
    if (!this._isMobileFiltersOpen()) this.navigate('vacancies');
  },

  setQuickFilter(cat) {
    this.filters.category = cat;
    this.vacPage = 1;
    this.navigate('vacancies');
  },

  toggleCategory(cat) {
    this.filters.category = this.filters.category===cat ? '' : cat;
    this.vacPage = 1;
    if (!this._isMobileFiltersOpen()) this.navigate('vacancies');
  },

  updateSalarySlider() {
    const fromEl = document.getElementById('salaryFrom');
    const toEl = document.getElementById('salaryTo');
    let fromVal = parseInt(fromEl.value);
    let toVal = parseInt(toEl.value);
    if (fromVal > toVal) { [fromVal, toVal] = [toVal, fromVal]; fromEl.value = fromVal; toEl.value = toVal; }
    document.getElementById('salMinVal').textContent = fromVal.toLocaleString('uk') + ' ₴';
    document.getElementById('salMaxVal').textContent = toVal.toLocaleString('uk') + ' ₴';
    const min = 10000, max = 70000, range = max - min;
    const left = ((fromVal - min) / range) * 100;
    const right = ((toVal - min) / range) * 100;
    const fill = document.getElementById('salTrackFill');
    if (fill) { fill.style.left = left + '%'; fill.style.width = (right - left) + '%'; }
    this.filters.salaryFrom = fromVal <= 10000 ? null : fromVal;
    this.filters.salaryTo = toVal >= 70000 ? null : toVal;
    this.vacPage = 1;
    if (!this._isMobileFiltersOpen()) {
      clearTimeout(this._salaryDebounce);
      this._salaryDebounce = setTimeout(() => { this.navigate('vacancies'); }, 300);
    }
  },

  setSalary() { this.updateSalarySlider(); },

  setSort(val) {
    this.filters.sort = val;
    this.navigate('vacancies');
  },

  liveSearch(val) {
    this.filters.search = val;
    this.vacPage = 1;
    clearTimeout(this._searchTimeout);
    this._searchTimeout = setTimeout(() => this.refreshResults(), 300);
  },

  refreshResults() {
    var filtered = this.getFiltered();
    var total = filtered.length;
    var totalPages = Math.ceil(total / this.perPage);
    var page = Math.min(this.vacPage, totalPages || 1);
    var paged = filtered.slice((page - 1) * this.perPage, page * this.perPage);
    var grid = document.querySelector('.results-grid');
    if (grid) {
      grid.innerHTML = paged.length ? paged.map(function(v) { return App.renderVacancyCard(v, 'fade-in'); }).join('') : '<div class="no-results"><p style="font-size:48px;margin-bottom:var(--s-4)">🔍</p><p style="font-size:var(--t-16)">За вашим запитом нічого не знайдено</p><p style="margin-top:var(--s-3)"><button class="btn btn-primary" onclick="App.resetFilters()">Скинути фільтри</button></p></div>';
    }
    var countEl = document.querySelector('.cat-count strong');
    if (countEl) countEl.textContent = total;
    var pagEl = document.querySelector('.pagination');
    if (pagEl) {
      if (totalPages > 1) {
        pagEl.innerHTML = '<button ' + (page <= 1 ? 'disabled' : '') + ' onclick="App.vacPage=' + (page - 1) + ';App.refreshResults()">‹</button>' +
          Array.from({length: totalPages}, function(_, i) { return i + 1; }).map(function(p) {
            return '<button class="' + (p === page ? 'active' : '') + '" onclick="App.vacPage=' + p + ';App.refreshResults()">' + p + '</button>';
          }).join('') +
          '<button ' + (page >= totalPages ? 'disabled' : '') + ' onclick="App.vacPage=' + (page + 1) + ';App.refreshResults()">›</button>';
      } else {
        pagEl.innerHTML = '';
      }
    } else if (totalPages > 1) {
      var resultsParent = document.querySelector('.results-grid');
      if (resultsParent && resultsParent.parentNode) {
        var pDiv = document.createElement('div');
        pDiv.className = 'pagination';
        resultsParent.parentNode.appendChild(pDiv);
        this.refreshResults();
      }
    }
    var af = this.filters;
    var activeFilters = [];
    if (af.search) activeFilters.push({label: '"' + af.search + '"', key: 'search'});
    if (af.category) activeFilters.push({label: af.category, key: 'category'});
    var afWrap = document.querySelector('.active-filters');
    if (activeFilters.length && !afWrap) {
      var qf = document.querySelector('.quick-filters');
      if (qf) {
        var d = document.createElement('div');
        d.className = 'active-filters';
        qf.after(d);
        afWrap = d;
      }
    }
    if (afWrap) {
      if (activeFilters.length) {
        afWrap.innerHTML = activeFilters.map(function(a) { return '<span class="af-pill">' + a.label + '<span class="x" onclick="App.removeFilter(\'' + a.key + '\',\'\')">&times;</span></span>'; }).join('') + '<button style="color:var(--red-600);font-size:var(--t-13);font-weight:600;cursor:pointer;background:none;border:0" onclick="App.resetFilters()">Скинути</button>';
      } else {
        afWrap.remove();
      }
    }
  },

  removeFilter(key, val) {
    if (key==='search') this.filters.search='';
    else if (key==='category') this.filters.category='';
    else if (val && Array.isArray(this.filters[key])) {
      const idx = this.filters[key].indexOf(val);
      if (idx>=0) this.filters[key].splice(idx,1);
    }
    this.vacPage=1;
    this.navigate('vacancies');
  },

  resetFilters() {
    this.filters = {cities:[],employment:[],experience:[],salaryFrom:null,salaryTo:null,schedule:[],search:'',category:'',sort:'relevance'};
    this.vacPage = 1;
    this.navigate('vacancies');
  },

              <h3>Що ми очікуємо</h3>

              <h3>Що ми пропонуємо</h3>

                ${v.offers.map((o,i)=>{

                  const icons = ['💰','📋','🎓','🎁','🏥','📈'];

          <aside class="detail-sidebar">
            <div class="apply-card">
              <div class="salary-big">${v.salary.toLocaleString('uk')}<span class="currency">₴/міс</span></div>

                з бонусами до +20%
                <span class="pct">Ринкова</span>

  bindCalculator() {
    let calcRole = 22000;
    let calcSegMult = 1.0;
    let calcCityMult = 1.1;
    const fmt = (n) => Math.round(n).toLocaleString('uk-UA');
    const fmtK = (n) => { const k = n / 1000; return (k % 1 === 0 ? k.toFixed(0) : k.toFixed(1).replace('.', ',')) + ' тис'; };

    const recalc = () => {
      const slider = document.getElementById('hoursSlider');
      const hours = parseInt(slider.value);
      document.getElementById('hoursVal').innerHTML = hours + '<small>год/тиждень</small>';

      const base = calcRole * (hours / 40) * calcSegMult;
      let bonus = 0;
      document.querySelectorAll('.toggle-row.on').forEach(t => {
        bonus += parseInt(t.dataset.amt) || 0;
      });
      const cityBonus = base * (calcCityMult - 1);
      const total = Math.round((base + bonus + cityBonus) / 100) * 100;

      document.getElementById('totalVal').textContent = fmt(total);

      const lo = Math.round(total * 0.87 / 100) * 100;
      const hi = Math.round(total * 1.13 / 100) * 100;
      document.getElementById('rangeVal').textContent = fmt(lo) + ' — ' + fmt(hi) + ' ₴';

      const pct = Math.round((total / (calcRole * 0.85) - 1) * 100);
      document.getElementById('compPct').textContent = '+' + pct + '%';

      const activeCity = document.querySelector('.city-pill.on');
      const cityName = activeCity ? activeCity.textContent.split('×')[0].trim() : 'Києві';
      const cityLocative = {'Київ':'Києві','Харків':'Харкові','Одеса':'Одесі','Дніпро':'Дніпрі','Львів':'Львові'}[cityName] || cityName;
      document.getElementById('compCity').textContent = cityLocative;

      const baseRound = Math.round(base);
      const bonusRound = Math.round(bonus);
      const cityRound = Math.round(cityBonus);
      const extraRound = Math.max(0, total - baseRound - bonusRound - cityRound);
      const t = total || 1;
      document.getElementById('barBase').style.width = Math.round(baseRound / t * 100) + '%';
      document.getElementById('barBonus').style.width = Math.round(bonusRound / t * 100) + '%';
      document.getElementById('barCity').style.width = Math.round(cityRound / t * 100) + '%';
      document.getElementById('barExtra').style.width = Math.round(extraRound / t * 100) + '%';

      document.getElementById('bkBaseAmt').textContent = fmt(baseRound) + ' ₴';
      document.getElementById('bkBonusAmt').textContent = fmt(bonusRound) + ' ₴';
      document.getElementById('bkCityAmt').textContent = fmt(cityRound) + ' ₴';
      document.getElementById('bkExtraAmt').textContent = fmt(extraRound) + ' ₴';

      document.getElementById('fcNow').textContent = fmtK(total);
      document.getElementById('fc6m').textContent = fmtK(total * 1.14);
      document.getElementById('fc1y').textContent = fmtK(total * 1.36);
    };

    document.querySelectorAll('.role-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.role-pill').forEach(r => r.classList.remove('on'));
        pill.classList.add('on');
        calcRole = parseInt(pill.dataset.base);
        recalc();
      });
    });

    document.querySelectorAll('#calcSeg button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#calcSeg button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        calcSegMult = parseFloat(btn.dataset.mult);
        recalc();
      });
    });

    document.getElementById('hoursSlider').addEventListener('input', recalc);

    document.querySelectorAll('.toggle-row').forEach(row => {
      row.addEventListener('click', () => {
        row.classList.toggle('on');
        recalc();
      });
    });

    document.querySelectorAll('#calcCities .city-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('#calcCities .city-pill').forEach(c => c.classList.remove('on'));
        pill.classList.add('on');
        calcCityMult = parseFloat(pill.dataset.mult);
        recalc();
      });
    });

    recalc();
  },

  bindStories() {
    document.querySelectorAll('#reelsFilters .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#reelsFilters .chip').forEach(c => c.classList.remove('on'));
        chip.classList.add('on');
      });
    });
    document.querySelectorAll('.story-circle').forEach(c => {
      c.addEventListener('click', () => c.classList.add('viewed'));
    });
    // autoplay reel thumbnails on hover
    document.querySelectorAll('.reel video, .feat-video video').forEach(v => {
      const parent = v.closest('.reel') || v.closest('.feat-video');
      if (parent) {
        parent.addEventListener('mouseenter', () => { v.currentTime = 0; v.play().catch(()=>{}); });
        parent.addEventListener('mouseleave', () => { v.pause(); });
      }
    });
    // viewer: auto-advance when video ends
    const vid = document.getElementById('viewerVideo');
    if (vid) vid.addEventListener('ended', () => this.nextStory());
  },

  openViewer(idx) {
    if (typeof idx !== 'number') idx = 0;
    this._currentStory = idx;
    const v = document.getElementById('storyViewer');
    if (v) {
      v.classList.add('open');
      document.body.style.overflow = 'hidden';
      this._loadStory(idx);
    }
  },

  _loadStory(idx) {
    const stories = this._storyData;
    if (idx < 0 || idx >= stories.length) { this.closeViewer(); return; }
    this._currentStory = idx;
    const s = stories[idx];
    const vid = document.getElementById('viewerVideo');
    vid.src = s.src;
    vid.play().catch(()=>{});
    document.getElementById('viewerAva').textContent = s.ava;
    document.getElementById('viewerName').textContent = s.name;
    document.getElementById('viewerRole').textContent = s.role;
    document.getElementById('viewerTitle').textContent = s.title;
    // progress dots — set duration from video metadata
    const prog = document.getElementById('viewerProgress');
    const buildProgress = () => {
      const dur = vid.duration || 15;
      prog.style.setProperty('--story-dur', dur + 's');
      prog.innerHTML = stories.map((_,i) =>
        '<div class="s' + (i < idx ? ' done' : i === idx ? ' active' : '') + '"></div>'
      ).join('');
    };
    if (vid.readyState >= 1) buildProgress();
    else vid.addEventListener('loadedmetadata', buildProgress, {once:true});
    // mark circle as viewed
    const circles = document.querySelectorAll('.story-circle');
    if (circles[idx]) circles[idx].classList.add('viewed');
  },

  nextStory() {
    this._loadStory(this._currentStory + 1);
  },

  closeViewer() {
    const v = document.getElementById('storyViewer');
    if (v) {
      v.classList.remove('open');
      const vid = document.getElementById('viewerVideo');
      if (vid) { vid.pause(); vid.src = ''; }
      document.body.style.overflow = '';
    }
  },

  _onResumeChange(input) {

  submitForm() {
    let valid = true;
    const name = document.getElementById('formName').value.trim();
    const phone = document.getElementById('formPhone').value.trim();
    const city = document.getElementById('formCity').value;
    const consent = document.getElementById('formConsent').checked;
    const position = document.getElementById('formPosition') ? document.getElementById('formPosition').value.trim() : '';
    const workplace = document.getElementById('formWorkplace') ? document.getElementById('formWorkplace').value.trim() : '';
    const resumeInput = document.getElementById('formResume');

    document.querySelectorAll('.form-group').forEach(g => g.classList.remove('has-error'));

    if (!name) { document.getElementById('fg-name').classList.add('has-error'); valid = false; }
    if (!phone || phone.length < 10) { document.getElementById('fg-phone').classList.add('has-error'); valid = false; }
    if (!city) { document.getElementById('fg-city').classList.add('has-error'); valid = false; }
    if (!consent) { this.showToast('Погодьтеся з правилами обробки даних',''); return; }

    if (!valid) return;

    // Send to API
    const formData = new FormData();
    formData.append('name', name);
    formData.append('phone', '+380' + phone);
    formData.append('city', city);
    if (position) formData.append('position', position);
    if (workplace) formData.append('workplace', workplace);
    if (this._currentVacancy) {
      formData.append('vacancyId', this._currentVacancy._id || '');
      formData.append('vacancyTitle', this._currentVacancy.title || '');
    }
    if (resumeInput && resumeInput.files[0]) {
      formData.append('resume', resumeInput.files[0]);
    }

    fetch('/api/applications', { method: 'POST', body: formData })
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          document.getElementById('formView').style.display = 'none';
          document.getElementById('successView').style.display = 'block';
        } else {
          this.showToast(data.error || 'Помилка відправки', 'error');
        }
      })
      .catch(() => {
        // Fallback: show success anyway (for offline/static mode)
        document.getElementById('formView').style.display = 'none';
        document.getElementById('successView').style.display = 'block';
      });
  },

    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.className = 'toast', 3000);

// INIT — load data from API, then initialize
(async function loadAndInit() {
  try {
    const [vacRes, citiesRes, storiesRes] = await Promise.all([
      fetch('/api/vacancies?limit=1000').then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('/api/cities').then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('/api/stories').then(r => r.ok ? r.json() : null).catch(() => null)
    ]);
    if (vacRes && vacRes.vacancies) {
      VACANCIES = vacRes.vacancies.map(v => ({ ...v, id: v._id || v.legacyId || v.id }));
    }
    if (citiesRes) {
      if (citiesRes.primary) CITIES = citiesRes.primary;
      if (citiesRes.all) ALL_CITIES = citiesRes.all;
    }
    if (storiesRes && storiesRes.length) {
      App._storyData = storiesRes.map(s => ({
        src: s.src, name: s.name, role: s.role, ava: s.ava, title: s.title
      }));
    }
  } catch (e) {
    console.log('API not available, using hardcoded data');
  }
  App.init();
})();
</script>
