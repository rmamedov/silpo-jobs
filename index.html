<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сільпо — Вакансії</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00a651;--green-dark:#008c44;--green-light:#e6f7ed;
  --dark:#1a1a1a;--text:#333;--text-light:#666;
  --bg:#fff;--bg-light:#f5f5f5;--border:#e0e0e0;
  --red:#e30613;--orange:#ff6b00;
  --radius:12px;--radius-sm:8px;--radius-pill:50px;
  --shadow:0 2px 12px rgba(0,0,0,.08);--max-w:1200px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font:inherit;border:none;background:none}
img{max-width:100%;display:block}
ul{list-style:none}
input,select,textarea{font:inherit}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border)}
.header-inner{max-width:var(--max-w);margin:0 auto;padding:0 24px;display:flex;align-items:center;height:60px;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:#fff;background:var(--dark);padding:6px 18px;border-radius:var(--radius-pill);white-space:nowrap;cursor:pointer}
.header-search{flex:1;max-width:400px;position:relative}
.header-search input{width:100%;padding:8px 16px 8px 36px;border:1px solid var(--border);border-radius:var(--radius-pill);font-size:14px;outline:none;transition:border-color .2s}
.header-search input:focus{border-color:var(--green)}
.header-search::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px}

/* AUTOSUGGEST */
.autosuggest{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200;max-height:360px;overflow-y:auto;display:none}
.autosuggest.open{display:block}
.autosuggest-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--bg-light)}
.autosuggest-item:last-child{border-bottom:none}
.autosuggest-item:hover,.autosuggest-item.selected{background:var(--green-light)}
.autosuggest-item .as-icon{width:36px;height:36px;border-radius:8px;background:var(--bg-light);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.autosuggest-item .as-info{flex:1;min-width:0}
.autosuggest-item .as-title{font-size:14px;font-weight:600;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.autosuggest-item .as-title mark{background:var(--green-light);color:var(--green-dark);border-radius:2px;padding:0 1px}
.autosuggest-item .as-meta{font-size:12px;color:var(--text-light);display:flex;gap:8px;margin-top:2px}
.autosuggest-item .as-salary{font-size:13px;font-weight:700;color:var(--green);white-space:nowrap;flex-shrink:0}
.autosuggest-hint{padding:10px 16px;font-size:12px;color:var(--text-light);text-align:center}
.search-wrap{position:relative}
.header-right{display:flex;align-items:center;gap:16px;margin-left:auto;font-size:14px;color:var(--text-light)}
.header-right .user{display:flex;align-items:center;gap:8px}
.header-right .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

/* NAV */
.nav{background:#fff;border-bottom:1px solid var(--border)}
.nav-inner{max-width:var(--max-w);margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.nav a{display:block;padding:14px 16px;font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;cursor:pointer}
.nav a:hover,.nav a.active{color:var(--green);border-bottom-color:var(--green)}

/* HERO */
.hero{background:linear-gradient(135deg,#004d25 0%,#00a651 60%,#33cc77 100%);color:#fff;padding:64px 0}
.hero-inner{max-width:var(--max-w);margin:0 auto;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.hero h1{font-size:42px;line-height:1.15;font-weight:800;margin-bottom:16px}
.hero p{font-size:18px;opacity:.9;margin-bottom:32px}
.hero-cta{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--green-dark);font-weight:700;font-size:16px;padding:14px 32px;border-radius:var(--radius-pill);transition:all .2s;cursor:pointer;border:none}
.hero-cta:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.hero-contacts{margin-top:24px;font-size:14px;opacity:.85;display:flex;flex-direction:column;gap:4px}
.hero-image{display:flex;gap:12px;justify-content:center}
.hero-image .card-preview{background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border-radius:var(--radius);padding:20px;width:200px;border:1px solid rgba(255,255,255,.2)}
.hero-image .card-preview h4{font-size:14px;margin-bottom:8px}
.hero-image .card-preview .salary{color:#ffe082;font-weight:700;font-size:16px}

/* SEARCH BAR */
.search-section{max-width:var(--max-w);margin:-28px auto 0;padding:0 24px;position:relative;z-index:10}
.search-bar{display:flex;gap:12px;background:#fff;padding:16px 24px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
.search-bar input{flex:1;width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;outline:none;transition:border-color .2s}
.search-bar input:focus{border-color:var(--green)}
.search-bar select{padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;outline:none;background:#fff;min-width:160px}
.search-bar .btn-search{background:var(--green);color:#fff;padding:12px 32px;border-radius:var(--radius-sm);font-weight:600;font-size:15px;transition:background .2s}
.search-bar .btn-search:hover{background:var(--green-dark)}

/* SECTIONS */
.section{max-width:var(--max-w);margin:0 auto;padding:48px 24px}
.section-title{font-size:28px;font-weight:800;margin-bottom:24px;color:var(--dark)}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.section-header .link-all{color:var(--green);font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;cursor:pointer}

/* CATEGORIES */
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
.cat-card{border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;transition:all .2s;cursor:pointer;position:relative;overflow:hidden}
.cat-card:hover{border-color:var(--green);box-shadow:0 4px 20px rgba(0,166,81,.12)}
.cat-card .cat-icon{font-size:32px;margin-bottom:16px}
.cat-card h3{font-size:20px;font-weight:700;margin-bottom:12px;color:var(--dark)}
.cat-card .cat-list{color:var(--text-light);font-size:14px;line-height:1.8}
.cat-card .cat-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.cat-card .cat-count{font-weight:700;color:var(--dark)}
.cat-card .cat-arrow{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .2s}
.cat-card:hover .cat-arrow{transform:translateX(4px)}

/* PILLS */
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 20px;border-radius:var(--radius-pill);font-size:14px;font-weight:500;border:1px solid var(--border);background:#fff;color:var(--text);transition:all .2s}
.pill:hover{border-color:var(--green);color:var(--green)}
.pill.active{background:var(--green);color:#fff;border-color:var(--green)}

/* VACANCY CARDS */
.vacancies-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.vacancy-card{border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;transition:all .2s;cursor:pointer}
.vacancy-card:hover{border-color:var(--green);box-shadow:0 4px 16px rgba(0,166,81,.1)}
.vacancy-card .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{padding:4px 12px;border-radius:var(--radius-pill);font-size:12px;font-weight:500}
.tag-cat{background:var(--green-light);color:var(--green-dark)}
.tag-hot{background:#fff3e0;color:var(--orange)}
.tag-warehouse{background:#e3f2fd;color:#1565c0}
.tag-office{background:#f3e5f5;color:#7b1fa2}
.tag-intern{background:#fff8e1;color:#f57f17}
.vacancy-card h4{font-size:17px;font-weight:700;color:var(--dark);margin-bottom:8px}
.vacancy-card .location{font-size:13px;color:var(--text-light);margin-bottom:12px}
.vacancy-card .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.badge{padding:4px 10px;border-radius:var(--radius-sm);font-size:12px;background:var(--bg-light);color:var(--text-light);border:1px solid var(--border)}
.vacancy-card .salary{font-size:16px;font-weight:700;color:var(--green)}
.vacancy-card .date{font-size:12px;color:var(--text-light);margin-top:8px}

/* BTN-MORE */
.btn-more{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:1px solid var(--border);border-radius:var(--radius);font-weight:600;color:var(--text);margin-top:20px;transition:all .2s}
.btn-more:hover{border-color:var(--green);color:var(--green)}

/* COURIER SECTION */
.courier-section{background:var(--dark);color:#fff;border-radius:var(--radius);padding:48px;margin-top:48px}
.courier-section .label{text-transform:uppercase;font-size:12px;letter-spacing:2px;color:var(--green);font-weight:600;margin-bottom:12px}
.courier-section h2{font-size:32px;font-weight:800;margin-bottom:16px}
.courier-section>p{color:rgba(255,255,255,.7);margin-bottom:24px;max-width:640px}
.courier-section ul{color:rgba(255,255,255,.75);font-size:14px;margin-bottom:32px}
.courier-section ul li{padding:8px 0;padding-left:20px;position:relative}
.courier-section ul li::before{content:'—';position:absolute;left:0}
.courier-btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;padding:14px 32px;border-radius:var(--radius-pill);font-weight:700;font-size:15px;transition:all .2s}
.courier-btn:hover{background:var(--green-dark);transform:translateY(-2px)}
.courier-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px;padding-top:36px;border-top:1px solid rgba(255,255,255,.15)}
.courier-stat .num{font-size:36px;font-weight:800;color:var(--green)}
.courier-stat .desc{font-size:13px;color:rgba(255,255,255,.6);margin-top:4px}

/* BENEFITS */
.benefits-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.benefit-card{border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:all .2s}
.benefit-card:hover{border-color:var(--green);transform:translateY(-2px)}
.benefit-card .benefit-icon{width:40px;height:40px;border-radius:10px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:16px}
.benefit-card h4{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--dark)}
.benefit-card p{font-size:13px;color:var(--text-light)}

/* STEPS */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:24px}
.step{text-align:center;position:relative}
.step::after{content:'';position:absolute;top:28px;left:60%;width:80%;height:2px;background:var(--border)}
.step:last-child::after{display:none}
.step .step-num{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;margin:0 auto 16px;position:relative;z-index:1}
.step h4{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--dark)}
.step p{font-size:13px;color:var(--text-light)}

/* PHOTOS */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.photo-grid .photo{border-radius:var(--radius);overflow:hidden;position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);display:flex;align-items:flex-end}
.photo-grid .photo .photo-label{background:rgba(0,0,0,.6);color:#fff;padding:8px 16px;font-size:13px;width:100%;backdrop-filter:blur(4px)}
.photo-grid .photo .photo-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;opacity:.3}

/* TESTIMONIALS */
.testimonials{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:24px}
.testimonial{border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:all .2s}
.testimonial:hover{border-color:var(--green)}
.testimonial .quote{font-size:14px;color:var(--text);font-style:italic;margin-bottom:16px;line-height:1.6}
.testimonial .author{display:flex;align-items:center;gap:12px}
.testimonial .avatar{width:40px;height:40px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--green)}
.testimonial .author-info h5{font-size:14px;font-weight:700;color:var(--dark)}
.testimonial .author-info span{font-size:12px;color:var(--text-light)}

/* FAQ */
.faq-list{margin-top:24px}
.faq-item{border-bottom:1px solid var(--border)}
.faq-q{display:flex;justify-content:space-between;align-items:center;padding:20px 0;cursor:pointer;font-weight:600;font-size:16px;color:var(--dark);gap:16px}
.faq-q .icon{width:28px;height:28px;border-radius:50%;background:var(--bg-light);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-light);transition:all .3s;flex-shrink:0}
.faq-item.open .faq-q .icon{transform:rotate(45deg);background:var(--green-light);color:var(--green)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:14px;color:var(--text-light);line-height:1.7}
.faq-item.open .faq-a{max-height:200px;padding-bottom:20px}

/* CTA */
.cta-section{border:2px solid var(--green);border-radius:var(--radius);padding:48px;text-align:center;margin-top:48px}
.cta-section h2{font-size:28px;font-weight:800;margin-bottom:8px;color:var(--dark)}
.cta-section p{color:var(--text-light);margin-bottom:24px}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;padding:14px 32px;border-radius:var(--radius-pill);font-weight:700;font-size:15px;transition:all .2s;border:none}
.btn-primary:hover{background:var(--green-dark);transform:translateY(-2px)}

/* FOOTER */
.footer{background:var(--dark);color:#fff;padding:48px 0 24px;margin-top:64px}
.footer-inner{max-width:var(--max-w);margin:0 auto;padding:0 24px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:48px}
.footer-brand .footer-logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin-bottom:12px}
.footer-brand .footer-logo span{background:var(--green);padding:4px 12px;border-radius:var(--radius-sm);font-size:14px}
.footer-brand p{color:rgba(255,255,255,.5);font-size:13px;line-height:1.6;max-width:300px}
.footer h4{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.4);margin-bottom:16px}
.footer ul li{margin-bottom:10px}
.footer ul li a{color:rgba(255,255,255,.65);font-size:14px;transition:color .2s;cursor:pointer}
.footer ul li a:hover{color:var(--green)}
.footer-bottom{max-width:var(--max-w);margin:0 auto;padding:24px;display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.1);margin-top:36px;color:rgba(255,255,255,.35);font-size:13px}

/* MOBILE NAV */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:100;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
.mobile-nav-inner{display:flex;justify-content:space-around}
.mobile-nav a{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--text-light);gap:4px;padding:4px 8px;cursor:pointer}
.mobile-nav a.active{color:var(--green)}
.mobile-nav a .nav-icon{font-size:20px}

/* === VACANCIES PAGE === */
.vac-page{max-width:var(--max-w);margin:0 auto;padding:32px 24px}
.vac-page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.vac-page-header h1{font-size:28px;font-weight:800;color:var(--dark)}
.vac-count{font-size:14px;color:var(--text-light)}
.vac-count strong{color:var(--green);font-size:20px}
.vac-layout{display:grid;grid-template-columns:280px 1fr;gap:32px}
.vac-filters{position:sticky;top:130px;align-self:start}
.filter-group{margin-bottom:24px}
.filter-group h4{font-size:14px;font-weight:700;color:var(--dark);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.filter-group label{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;color:var(--text);cursor:pointer}
.filter-group label input[type="checkbox"]{accent-color:var(--green);width:16px;height:16px}
.filter-group label .cnt{margin-left:auto;font-size:12px;color:var(--text-light)}
.filter-salary{display:flex;gap:8px}
.filter-salary input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none}
.filter-salary input:focus{border-color:var(--green)}
.vac-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.vac-toolbar .sort-wrap{display:flex;align-items:center;gap:8px;font-size:14px}
.vac-toolbar select{padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;background:#fff}
.active-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.active-filter{display:flex;align-items:center;gap:6px;padding:4px 12px;background:var(--green-light);color:var(--green-dark);border-radius:var(--radius-pill);font-size:13px}
.active-filter .remove{cursor:pointer;font-weight:700;font-size:16px;line-height:1}
.btn-reset{color:var(--red);font-size:13px;cursor:pointer;text-decoration:underline}
.pagination{display:flex;justify-content:center;gap:8px;margin-top:32px}
.pagination button{width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--border);background:#fff;font-weight:600;color:var(--text);transition:all .2s}
.pagination button:hover{border-color:var(--green);color:var(--green)}
.pagination button.active{background:var(--green);color:#fff;border-color:var(--green)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.no-results{text-align:center;padding:48px;color:var(--text-light);font-size:16px}

/* === VACANCY DETAIL === */
.detail-page{max-width:var(--max-w);margin:0 auto;padding:32px 24px}
.detail-back{display:inline-flex;align-items:center;gap:8px;color:var(--green);font-weight:600;margin-bottom:24px;cursor:pointer;font-size:14px}
.detail-layout{display:grid;grid-template-columns:1fr 360px;gap:32px}
.detail-main h1{font-size:28px;font-weight:800;color:var(--dark);margin-bottom:16px}
.detail-meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.detail-section{margin-bottom:28px}
.detail-section h3{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--dark)}
.detail-section ul{padding-left:20px}
.detail-section ul li{margin-bottom:8px;color:var(--text);font-size:14px;list-style:disc}
.detail-sidebar{position:sticky;top:130px;align-self:start}
.detail-sidebar .apply-box{border:2px solid var(--green);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:24px}
.detail-sidebar .apply-box .price{font-size:24px;font-weight:800;color:var(--green);margin-bottom:8px}
.detail-sidebar .apply-box .response-time{font-size:13px;color:var(--text-light);margin-bottom:16px}
.detail-sidebar .info-box{border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.detail-sidebar .info-box h4{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--dark)}
.detail-sidebar .info-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;font-size:14px}
.detail-sidebar .info-row .num{width:28px;height:28px;border-radius:50%;background:var(--green-light);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.similar-title{font-size:20px;font-weight:700;margin:32px 0 16px;color:var(--dark)}
.similar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* === MODAL === */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:center;padding:24px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:var(--radius);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;position:relative}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:18px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--bg-light);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;border:none}
.modal-body{padding:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--green)}
.form-group textarea{resize:vertical;min-height:80px}
.form-group .error-msg{color:var(--red);font-size:12px;margin-top:4px;display:none}
.form-group.has-error input,.form-group.has-error select{border-color:var(--red)}
.form-group.has-error .error-msg{display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-check{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:16px}
.form-check input{accent-color:var(--green);width:16px;height:16px}
.form-check a{color:var(--green);text-decoration:underline}
.btn-submit{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-weight:700;font-size:15px;transition:background .2s}
.btn-submit:hover{background:var(--green-dark)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.form-hint{text-align:center;font-size:12px;color:var(--text-light);margin-top:12px}
.success-view{text-align:center;padding:48px 24px}
.success-view .checkmark{width:64px;height:64px;border-radius:50%;background:var(--green-light);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px}
.success-view h3{font-size:22px;font-weight:800;margin-bottom:8px;color:var(--dark)}
.success-view p{color:var(--text-light);margin-bottom:24px;font-size:14px}
.success-view .btns{display:flex;gap:12px;justify-content:center}
.btn-outline{padding:12px 24px;border:1px solid var(--border);border-radius:var(--radius-pill);font-weight:600;color:var(--text);transition:all .2s}
.btn-outline:hover{border-color:var(--green);color:var(--green)}

/* === TOAST === */
.toast{position:fixed;top:80px;right:24px;background:var(--dark);color:#fff;padding:14px 24px;border-radius:var(--radius-sm);font-size:14px;z-index:300;transform:translateX(120%);transition:transform .3s ease;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{transform:translateX(0)}
.toast.success{border-left:4px solid var(--green)}

/* RESPONSIVE */
@media(max-width:900px){
  .vac-layout{grid-template-columns:1fr}
  .vac-filters{position:static}
  .detail-layout{grid-template-columns:1fr}
  .similar-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .hero-inner{grid-template-columns:1fr}
  .hero-image{display:none}
  .hero h1{font-size:28px}
  .categories{grid-template-columns:1fr}
  .vacancies-grid{grid-template-columns:1fr}
  .benefits-grid{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,1fr)}
  .step::after{display:none}
  .testimonials{grid-template-columns:1fr}
  .footer-inner{grid-template-columns:1fr;gap:32px}
  .photo-grid{grid-template-columns:1fr}
  .courier-section{padding:32px 20px}
  .courier-stats{grid-template-columns:1fr;gap:16px}
  .mobile-nav{display:block}
  body{padding-bottom:64px}
  .header-right,.header-search{display:none}
  .form-row{grid-template-columns:1fr}
  .search-bar{flex-wrap:wrap}
  .search-bar select{width:100%}
}
.page-view{display:none}
.page-view.active{display:block}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>

// ============ APP ============
const App = {
  currentPage: 'home',

  vacPage: 1,
  perPage: 9,
  hotCity: 'Всі',

  _skipPush: false,

  init() {
    this.bindNav();
    // Listen for browser back/forward
    window.addEventListener('popstate', (e) => {
      if (e.state) {
        this._skipPush = true;
        this.filters = e.state.filters ? JSON.parse(JSON.stringify(e.state.filters)) : this.filters;
        this.vacPage = e.state.vacPage || 1;
        this.hotCity = e.state.hotCity || 'Всі';
        this.renderPage(e.state.page, e.state.data);
        this._skipPush = false;
      }
    });
    // Initial page from URL hash or default to home
    const hash = location.hash.replace('#','');
    const startPage = hash && ['home','vacancies','courier','about'].includes(hash) ? hash : 'home';
    this.navigate(startPage);
    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) this.closeModal();
    });
    // Close autosuggest on outside click
    document.addEventListener('click', e => {
      if (!e.target.closest('.search-wrap')) {
        document.querySelectorAll('.autosuggest').forEach(el => {
          el.classList.remove('open'); el.innerHTML = '';
        });
      }
    });
  },

  bindNav() {
    document.querySelectorAll('#mainNav a').forEach(a => {
      a.addEventListener('click', () => this.navigate(a.dataset.page));
    });
  },

  navigate(page, data) {
    // Push state to browser history
    if (!this._skipPush) {
      const state = {
        page,
        data: data || null,
        filters: JSON.parse(JSON.stringify(this.filters)),
        vacPage: this.vacPage,
        hotCity: this.hotCity
      };
      const hash = '#' + page + (data ? '/' + data : '');
      history.pushState(state, '', hash);
    }
    this.renderPage(page, data);
  },

  renderPage(page, data) {
    this.currentPage = page;
    document.querySelectorAll('#mainNav a').forEach(a => {
      a.classList.toggle('active', a.dataset.page === page);
    });
    window.scrollTo(0, 0);
    const app = document.getElementById('app');
    switch(page) {
      case 'home': app.innerHTML = this.renderHome(); this.bindHome(); break;
      case 'vacancies': app.innerHTML = this.renderVacancies(); this.bindVacancies(); break;
      case 'detail': app.innerHTML = this.renderDetail(data); this.bindDetail(); break;
      case 'courier': app.innerHTML = this.renderCourier(); this.bindCourier(); break;
      case 'about': app.innerHTML = this.renderAbout(); break;
    }
  },

  // ============ FILTERING ============
  getFiltered() {
    let list = [...VACANCIES];
    const f = this.filters;
    if (f.search) {
      const s = f.search.toLowerCase();
      list = list.filter(v => v.title.toLowerCase().includes(s) || v.location.toLowerCase().includes(s) || v.category.toLowerCase().includes(s));
    }
    if (f.category) list = list.filter(v => v.category === f.category);
    if (f.cities.length) list = list.filter(v => f.cities.includes(v.city));
    if (f.employment.length) list = list.filter(v => f.employment.some(e => v.employment.includes(e)));
    if (f.experience.length) list = list.filter(v => {
      return f.experience.some(e => {
        if (e === 'none') return v.experience === 'none';
        if (e === '1year') return v.experience === '1year';
        if (e === '3years') return v.experience === '3years';
        return false;
      });
    });
    if (f.salaryFrom) list = list.filter(v => v.salary >= f.salaryFrom);
    if (f.salaryTo) list = list.filter(v => v.salary <= f.salaryTo);
    if (f.schedule.length) list = list.filter(v => f.schedule.includes(v.schedule));
    // sort
    if (f.sort === 'date') list.sort((a,b) => new Date(b.date)-new Date(a.date));
    else if (f.sort === 'salaryUp') list.sort((a,b) => a.salary-b.salary);
    else if (f.sort === 'salaryDown') list.sort((a,b) => b.salary-a.salary);
    return list;
  },

  searchFromHeader() {
    const val = document.getElementById('headerSearch').value.trim();
    this.closeSuggest('headerSuggest');
    this.filters.search = val;
    this.vacPage = 1;
    this.navigate('vacancies');
  },

  // ============ AUTOSUGGEST ============
  _suggestIdx: -1,

  buildSuggestResults(query) {
    if (!query || query.length < 3) return [];
    const q = query.toLowerCase();
    // tokenize query for full-text matching
    const tokens = q.split(/\s+/).filter(t => t.length > 0);
    const scored = VACANCIES.map(v => {
      const title = v.title.toLowerCase();
      let score = 0;
      // exact substring match in title — highest priority
      if (title.includes(q)) score += 100;
      // each token match
      tokens.forEach(t => { if (title.includes(t)) score += 30; });
      // match at start of words in title
      const words = title.split(/\s+/);
      tokens.forEach(t => { words.forEach(w => { if (w.startsWith(t)) score += 20; }); });
      return { vacancy: v, score };
    }).filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 7);
    return scored.map(x => x.vacancy);
  },

  highlightMatch(text, query) {
    if (!query || query.length < 3) return text;
    const tokens = query.toLowerCase().split(/\s+/).filter(t => t.length > 0);
    let result = text;
    tokens.forEach(t => {
      const regex = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      result = result.replace(regex, '<mark>$1</mark>');
    });
    return result;
  },

  renderSuggest(results, query, suggestId) {
    if (!results.length) {
      return '<div class="autosuggest-hint">Нічого не знайдено</div>';
    }
    const catIcons = {'Магазин':'🏪','Склад':'📦','Офіс':'🏢','Кур\'єр':'🛵'};
    return results.map((v, i) => `
      <div class="autosuggest-item${i === this._suggestIdx ? ' selected' : ''}"
        onmousedown="App.selectSuggest(${v.id},'${suggestId}')"
        onmouseenter="App._suggestIdx=${i};App.updateSuggestHighlight('${suggestId}')">
        <div class="as-icon">${catIcons[v.category]||'📋'}</div>
        <div class="as-info">
          <div class="as-title">${this.highlightMatch(v.title, query)}</div>
          <div class="as-meta"><span>📍 ${v.city}</span><span>${v.category}</span></div>
        </div>
        <div class="as-salary">від ${v.salary.toLocaleString('uk')} грн</div>
      </div>
    `).join('');
  },

  onSearchInput(input, suggestId) {
    const q = input.value.trim();
    const el = document.getElementById(suggestId);
    if (!el) return;
    this._suggestIdx = -1;
    if (q.length < 3) {
      el.classList.remove('open');
      el.innerHTML = '';
      return;
    }
    const results = this.buildSuggestResults(q);
    el.innerHTML = this.renderSuggest(results, q, suggestId);
    el.classList.add('open');
    this._currentSuggestResults = results;
    this._currentSuggestId = suggestId;
  },

  onSearchKeydown(e, suggestId) {
    const el = document.getElementById(suggestId);
    if (!el || !el.classList.contains('open')) {
      if (e.key === 'Enter') {
        this.doFullSearch(e.target);
      }
      return;
    }
    const results = this._currentSuggestResults || [];
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      this._suggestIdx = Math.min(this._suggestIdx + 1, results.length - 1);
      this.updateSuggestHighlight(suggestId);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      this._suggestIdx = Math.max(this._suggestIdx - 1, -1);
      this.updateSuggestHighlight(suggestId);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (this._suggestIdx >= 0 && results[this._suggestIdx]) {
        this.selectSuggest(results[this._suggestIdx].id, suggestId);
      } else {
        this.closeSuggest(suggestId);
        this.doFullSearch(e.target);
      }
    } else if (e.key === 'Escape') {
      this.closeSuggest(suggestId);
    }
  },

  updateSuggestHighlight(suggestId) {
    const el = document.getElementById(suggestId);
    if (!el) return;
    el.querySelectorAll('.autosuggest-item').forEach((item, i) => {
      item.classList.toggle('selected', i === this._suggestIdx);
    });
    // scroll selected into view
    const sel = el.querySelector('.autosuggest-item.selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  },

  selectSuggest(vacId, suggestId) {
    this.closeSuggest(suggestId);
    this.navigate('detail', vacId);
  },

  closeSuggest(suggestId) {
    const el = document.getElementById(suggestId);
    if (el) { el.classList.remove('open'); el.innerHTML = ''; }
    this._suggestIdx = -1;
    this._currentSuggestResults = [];
  },

  doFullSearch(input) {
    const val = input.value.trim();
    this.filters.search = val;
    this.vacPage = 1;
    this.navigate('vacancies');
  },

    const daysAgo = Math.round((Date.now()-new Date(v.date))/(1000*60*60*24));

      <div class="date">${daysAgo===0?'Сьогодні':daysAgo===1?'Вчора':daysAgo+' дн. тому'}</div>

  bindHome() {
    const inp = document.getElementById('homeSearch');
    if (inp) inp.addEventListener('keydown', e => { if (e.key==='Enter') this.homeSearch(); });
  },

  homeSearch() {
    const val = document.getElementById('homeSearch')?.value?.trim() || '';
    const city = document.getElementById('homeCity')?.value || '';
    this.filters = {...this.filters, search:val, cities:city?[city]:[], category:''};
    this.vacPage = 1;
    this.navigate('vacancies');
  },

  setHotCity(city) {
    this.hotCity = city;
    this.navigate('home');
  },

  // ============ VACANCIES PAGE ============
  renderVacancies() {
    const filtered = this.getFiltered();
    const total = filtered.length;
    const totalPages = Math.ceil(total/this.perPage);
    const page = Math.min(this.vacPage, totalPages || 1);
    const paged = filtered.slice((page-1)*this.perPage, page*this.perPage);
    const f = this.filters;
    const cityCount = c => VACANCIES.filter(v=>v.city===c).length;
    const activeFilters = [];
    if (f.search) activeFilters.push({label:`"${f.search}"`,key:'search'});
    if (f.category) activeFilters.push({label:f.category,key:'category'});
    f.cities.forEach(c=>activeFilters.push({label:c,key:'city',val:c}));
    f.employment.forEach(e=>activeFilters.push({label:e+' зайнятість',key:'employment',val:e}));
    f.experience.forEach(e=>activeFilters.push({label:e==='none'?'Без досвіду':e==='1year'?'До 1 року':'Від 3 років',key:'experience',val:e}));

    return `<div class="page-view active fade-in">
      <div class="vac-page">
        <div class="vac-page-header"><h1>Вакансії</h1><div class="vac-count">Знайдено: <strong>${total}</strong></div></div>
        ${activeFilters.length?`<div class="active-filters">${activeFilters.map(af=>`<span class="active-filter">${af.label}<span class="remove" onclick="App.removeFilter('${af.key}','${af.val||''}')">&times;</span></span>`).join('')}<button class="btn-reset" onclick="App.resetFilters()">Скинути всі</button></div>`:''}
        <div class="vac-layout">
          <aside class="vac-filters">
            <div class="filter-group"><h4>Категорія</h4>
              ${['Магазин','Склад','Офіс','Кур\'єр'].map(c=>`<label><input type="checkbox" value="${c}" ${f.category===c?'checked':''} onchange="App.toggleCategory('${c}')"> ${c} <span class="cnt">${VACANCIES.filter(v=>v.category===c).length}</span></label>`).join('')}
            </div>
            <div class="filter-group"><h4>Місто</h4>
              ${CITIES.map(c=>`<label><input type="checkbox" value="${c}" ${f.cities.includes(c)?'checked':''} onchange="App.toggleFilter('cities','${c}')"> ${c} <span class="cnt">${cityCount(c)}</span></label>`).join('')}
            </div>
            <div class="filter-group"><h4>Зайнятість</h4>
              ${['Повна','Часткова','Гнучка'].map(e=>`<label><input type="checkbox" value="${e}" ${f.employment.includes(e)?'checked':''} onchange="App.toggleFilter('employment','${e}')"> ${e}</label>`).join('')}
            </div>
            <div class="filter-group"><h4>Досвід</h4>
              ${[{v:'none',l:'Без досвіду'},{v:'1year',l:'Від 1 року'},{v:'3years',l:'Від 3 років'}].map(e=>`<label><input type="checkbox" value="${e.v}" ${f.experience.includes(e.v)?'checked':''} onchange="App.toggleFilter('experience','${e.v}')"> ${e.l}</label>`).join('')}
            </div>
            <div class="filter-group"><h4>Зарплата</h4><div class="filter-salary">
              <input type="number" placeholder="від" id="salaryFrom" value="${f.salaryFrom||''}" onchange="App.setSalary()">
              <input type="number" placeholder="до" id="salaryTo" value="${f.salaryTo||''}" onchange="App.setSalary()">
            </div></div>
            <div class="filter-group"><h4>Графік</h4>
              ${['5/2','2/2','Гнучкий','Нічні зміни'].map(s=>`<label><input type="checkbox" value="${s}" ${f.schedule.includes(s)?'checked':''} onchange="App.toggleFilter('schedule','${s}')"> ${s}</label>`).join('')}
            </div>
          </aside>
          <div>
            <div class="vac-toolbar"><div class="sort-wrap">Сортування: <select id="sortSelect" onchange="App.setSort(this.value)">
              <option value="relevance" ${f.sort==='relevance'?'selected':''}>За актуальністю</option>
              <option value="date" ${f.sort==='date'?'selected':''}>За датою</option>
              <option value="salaryUp" ${f.sort==='salaryUp'?'selected':''}>За зарплатою ↑</option>
              <option value="salaryDown" ${f.sort==='salaryDown'?'selected':''}>За зарплатою ↓</option>
            </select></div>
            <div class="search-wrap" style="width:260px">
              <input type="text" placeholder="🔍 Пошук..." value="${f.search}" id="vacSearch" autocomplete="off" style="padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;width:100%"
                oninput="App.onSearchInput(this,'vacSuggest');App.liveSearch(this.value)"
                onkeydown="App.onSearchKeydown(event,'vacSuggest')"
                onfocus="App.onSearchInput(this,'vacSuggest')"
              >
              <div class="autosuggest" id="vacSuggest"></div>
            </div>
            </div>
            <div class="vacancies-grid">${paged.length?paged.map(v=>this.renderVacancyCard(v,'fade-in')).join(''):`<div class="no-results" style="grid-column:1/-1"><p style="font-size:48px;margin-bottom:16px">🔍</p><p>За вашим запитом нічого не знайдено</p><p style="margin-top:8px"><button class="btn-primary" onclick="App.resetFilters()">Скинути фільтри</button></p></div>`}</div>
            ${totalPages>1?`<div class="pagination">
              <button ${page<=1?'disabled':''} onclick="App.vacPage=${page-1};App.navigate('vacancies')">‹</button>
              ${Array.from({length:totalPages},(_,i)=>i+1).map(p=>`<button class="${p===page?'active':''}" onclick="App.vacPage=${p};App.navigate('vacancies')">${p}</button>`).join('')}
              <button ${page>=totalPages?'disabled':''} onclick="App.vacPage=${page+1};App.navigate('vacancies')">›</button>
            </div>`:''}
          </div>
        </div>
      </div>
      ${this.renderFooter()}
    </div>`;

  bindVacancies() {},

  toggleFilter(key, val) {
    const arr = this.filters[key];
    const idx = arr.indexOf(val);
    if (idx>=0) arr.splice(idx,1); else arr.push(val);
    this.vacPage = 1;
    this.navigate('vacancies');
  },

  toggleCategory(cat) {
    this.filters.category = this.filters.category===cat ? '' : cat;
    this.vacPage = 1;
    this.navigate('vacancies');
  },

  setSalary() {
    const from = document.getElementById('salaryFrom')?.value;
    const to = document.getElementById('salaryTo')?.value;
    this.filters.salaryFrom = from ? parseInt(from) : null;
    this.filters.salaryTo = to ? parseInt(to) : null;
    this.vacPage = 1;
    this.navigate('vacancies');
  },

  setSort(val) {
    this.filters.sort = val;
    this.navigate('vacancies');
  },

  liveSearch(val) {
    this.filters.search = val;
    this.vacPage = 1;
    // debounced re-render
    clearTimeout(this._searchTimeout);
    this._searchTimeout = setTimeout(() => this.navigate('vacancies'), 300);
  },

  removeFilter(key, val) {
    if (key==='search') this.filters.search='';
    else if (key==='category') this.filters.category='';
    else if (val && Array.isArray(this.filters[key])) {
      const idx = this.filters[key].indexOf(val);
      if (idx>=0) this.filters[key].splice(idx,1);
    }
    this.vacPage=1;
    this.navigate('vacancies');
  },

  resetFilters() {
    this.filters = {cities:[],employment:[],experience:[],salaryFrom:null,salaryTo:null,schedule:[],search:'',category:'',sort:'relevance'};
    this.vacPage = 1;
    this.navigate('vacancies');
  },

    return `<div class="page-view active fade-in">

            <div class="detail-section"><h3>Що ми пропонуємо</h3><ul>${v.offers.map(o=>`<li>${o}</li>`).join('')}</ul></div>

              <button class="btn-primary" style="width:100%" onclick="App.openModal(${v.id})">Відгукнутись на вакансію</button>

            <div class="info-box">
              <h4>Як відбувається відбір</h4>
              ${[{n:'1',t:'Заявка',d:'Заповнюєш форму — 2 хвилини'},{n:'2',t:'Дзвінок',d:'HR телефонує протягом дня'},{n:'3',t:'Зустріч',d:'Співбесіда у магазині'},{n:'4',t:'Вихід',d:'Оформлення і перший день'}].map(s=>`<div class="info-row"><div class="num">${s.n}</div><div><strong>${s.t}</strong><br><span style="font-size:12px;color:var(--text-light)">${s.d}</span></div></div>`).join('')}

        </div>
        ${similar.length?`<h3 class="similar-title">Схожі вакансії</h3><div class="similar-grid">${similar.map(s=>this.renderVacancyCard(s)).join('')}</div>`:''}
      </div>
      ${this.renderFooter()}
    </div>`;

        <h2 class="section-title">Хто нам підходить</h2>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
          ${[{t:'Власний транспорт',d:'Скутер, мопед або авто'},{t:'Права кат. A або B',d:'Чинне посвідчення водія'},{t:'Смартфон',d:'Для застосунку кур\'єра'},{t:'Вік від 18 років',d:'Офіційне оформлення вимагає повноліття'}].map(r=>`<div style="border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center"><h4 style="font-weight:700;margin-bottom:6px">${r.t}</h4><p style="font-size:13px;color:var(--text-light)">${r.d}</p></div>`).join('')}
        </div>
      </section>
      <section class="section" style="padding-top:0">
        <h2 class="section-title">Відкриті позиції кур'єрів</h2>
        <div class="vacancies-grid">${courierVacs.map(v=>this.renderVacancyCard(v)).join('')}</div>
      </section>
      <section class="section" style="padding-top:0">
        <h2 class="section-title">Хочеш спробувати?</h2>
        <p style="color:var(--text-light);margin-bottom:24px">Залиш контакти — HR зателефонує і відповість на всі питання.</p>
        <div style="max-width:480px">
          <div class="form-row" style="margin-bottom:12px"><div class="form-group"><label>Ім'я *</label><input type="text" id="courierName" placeholder="Іван"></div><div class="form-group"><label>Телефон *</label><input type="tel" id="courierPhone" placeholder="+380 XX XXX XX XX"></div></div>
          <div class="form-row" style="margin-bottom:12px"><div class="form-group"><label>Місто *</label><select id="courierCity"><option value="">Оберіть місто</option>${CITIES.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="form-group"><label>Транспорт *</label><select id="courierTransport"><option>Скутер / мопед</option><option>Авто</option><option>Велосипед</option></select></div></div>
          <div class="form-check"><input type="checkbox" id="courierConsent"><label for="courierConsent">Погоджуюсь з обробкою персональних даних</label></div>
          <button class="btn-primary" onclick="App.submitCourierForm()">Передзвоніть мені →</button>
        </div>
      </section>
      ${this.renderFooter()}
    </div>`;
  },

  bindCourier() {},

  submitCourierForm() {
    const name = document.getElementById('courierName').value.trim();
    const phone = document.getElementById('courierPhone').value.trim();
    const city = document.getElementById('courierCity').value;
    const consent = document.getElementById('courierConsent').checked;
    if (!name || !phone || !city) { this.showToast('Заповніть всі обов\'язкові поля',''); return; }
    if (!consent) { this.showToast('Погодьтеся з обробкою даних',''); return; }
    this.showToast('Заявку надіслано! HR зателефонує найближчим часом.','success');
  },

  // ============ ABOUT ============
  renderAbout() {
    return `<div class="page-view active fade-in">
      <section class="section"><h1 class="section-title" style="font-size:36px">Про компанію Сільпо</h1>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:32px">
          <div><p style="font-size:16px;line-height:1.8;color:var(--text)">Сільпо — одна з найбільших роздрібних мереж України, що входить до складу Fozzy Group. Понад 300 магазинів у більш ніж 80 містах країни.</p>
          <p style="font-size:16px;line-height:1.8;color:var(--text);margin-top:16px">Ми створюємо не просто магазини, а простори для натхнення. Кожен Сільпо — це унікальний дизайн, найсвіжіші продукти та команда, яка любить свою справу.</p>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px">
            <div style="text-align:center"><div style="font-size:36px;font-weight:800;color:var(--green)">300+</div><div style="font-size:13px;color:var(--text-light)">магазинів</div></div>
            <div style="text-align:center"><div style="font-size:36px;font-weight:800;color:var(--green)">80+</div><div style="font-size:13px;color:var(--text-light)">міст</div></div>
            <div style="text-align:center"><div style="font-size:36px;font-weight:800;color:var(--green)">30 000+</div><div style="font-size:13px;color:var(--text-light)">працівників</div></div>
          </div></div>
          <div style="background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:80px;min-height:300px;opacity:.5">🏪</div>
        </div>
      </section>
      <section class="section" style="padding-top:0"><h2 class="section-title">Наші цінності</h2><div class="benefits-grid">
        ${[{i:'❤️',t:'Любов до людей',d:'Кожен клієнт і кожен колега — важливий'},{i:'🌟',t:'Інновації',d:'Ми постійно шукаємо нові ідеї та рішення'},{i:'🤲',t:'Відповідальність',d:'Перед командою, суспільством та довкіллям'},{i:'🎯',t:'Результат',d:'Ставимо амбітні цілі та досягаємо їх разом'},{i:'📖',t:'Розвиток',d:'Навчання та зростання — частина культури'},{i:'🤝',t:'Команда',d:'Разом ми сильніші за кожного окремо'}].map(v=>`<div class="benefit-card"><div class="benefit-icon">${v.i}</div><h4>${v.t}</h4><p>${v.d}</p></div>`).join('')}
      </div></section>
      <section class="section" style="padding-top:0"><div class="cta-section"><h2>Хочеш стати частиною команди?</h2><p>Переглянь відкриті вакансії або залиш анкету</p><div style="display:flex;gap:12px;justify-content:center"><button class="btn-primary" onclick="App.navigate('vacancies')">Переглянути вакансії</button><button class="btn-outline" onclick="App.openModal()">Залишити анкету</button></div></div></section>
      ${this.renderFooter()}
    </div>`;
  },

  // ============ MODAL ============
  openModal(vacId) {
    const v = vacId ? VACANCIES.find(x=>x.id===vacId) : null;
    const vacTitle = v ? v.title : '';
    document.getElementById('modalContent').innerHTML = `
      <div class="modal-header"><h3>Відгук на вакансію</h3><button class="modal-close" onclick="App.closeModal()">✕</button></div>
      <div class="modal-body" id="formView">
        ${v?`<div style="background:var(--green-light);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:16px;font-size:14px;color:var(--green-dark)">📋 ${v.title} — ${v.location}</div>`:''}
        <div class="form-group" id="fg-name"><label>Ім'я *</label><input type="text" id="formName" placeholder="Ваше ім'я"><div class="error-msg">Введіть ім'я</div></div>
        <div class="form-group" id="fg-phone"><label>Телефон *</label><input type="tel" id="formPhone" placeholder="+380 XX XXX XX XX"><div class="error-msg">Введіть номер телефону</div></div>
        <div class="form-row">
          <div class="form-group"><label>Де бажаєте працювати</label><select id="formPlace"><option value="">Оберіть</option><option>Магазин</option><option>Склад</option><option>Офіс</option><option>Кур'єр</option></select></div>
          <div class="form-group" id="fg-city"><label>Місто *</label><select id="formCity"><option value="">Оберіть місто</option>${CITIES.map(c=>`<option ${v&&v.city===c?'selected':''}>${c}</option>`).join('')}</select><div class="error-msg">Оберіть місто</div></div>
        </div>
        <div class="form-group"><label>Бажана посада</label><input type="text" id="formPosition" placeholder="Наприклад, касир" value="${vacTitle}"></div>
        <div class="form-group"><label>Коментар</label><textarea id="formComment" placeholder="Додаткова інформація"></textarea></div>
        <div class="form-group"><label>Звідки дізналися</label><select id="formSource"><option value="">Оберіть</option><option>Сайт Сільпо</option><option>Work.ua / Rabota.ua</option><option>Соцмережі</option><option>Від знайомих</option><option>Оголошення у магазині</option><option>Інше</option></select></div>
        <div class="form-check"><input type="checkbox" id="formConsent"><label for="formConsent">Згоден з <a href="#">Правилами обробки персональних даних</a></label></div>
        <button class="btn-submit" onclick="App.submitForm()">Надіслати</button>
        <div class="form-hint">Зазвичай HR зв'язується протягом 1 робочого дня</div>
      </div>
      <div class="success-view" id="successView" style="display:none">
        <div class="checkmark">✓</div>
        <h3>Заявку надіслано!</h3>
        <p>Дякуємо за відгук. HR-менеджер зв'яжеться з тобою протягом 1 робочого дня.</p>
        <div class="btns">
          <button class="btn-outline" onclick="App.closeModal();App.navigate('home')">На головну</button>
          <button class="btn-primary" onclick="App.closeModal();App.navigate('vacancies')">Ще вакансії</button>
        </div>
      </div>`;
    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  },

  closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  },

  submitForm() {
    let valid = true;
    const name = document.getElementById('formName').value.trim();
    const phone = document.getElementById('formPhone').value.trim();
    const city = document.getElementById('formCity').value;
    const consent = document.getElementById('formConsent').checked;

    document.querySelectorAll('.form-group').forEach(g => g.classList.remove('has-error'));

    if (!name) { document.getElementById('fg-name').classList.add('has-error'); valid = false; }
    if (!phone || phone.length < 10) { document.getElementById('fg-phone').classList.add('has-error'); valid = false; }
    if (!city) { document.getElementById('fg-city').classList.add('has-error'); valid = false; }
    if (!consent) { this.showToast('Погодьтеся з правилами обробки даних',''); return; }

    if (!valid) return;

    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
  },

  // ============ TOAST ============
  showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.className = 'toast', 3000);
  },

  // ============ FOOTER ============
  renderFooter() {
    return `<footer class="footer"><div class="footer-inner">
      <div class="footer-brand"><div class="footer-logo"><span>С</span> Сільпо Роботи</div><p>Знайди роботу у одній з найбільших роздрібних мереж України. Понад 500 вакансій по всій країні.</p></div>
      <div><h4>Вакансії</h4><ul>
        <li><a onclick="App.filters.category='Магазин';App.navigate('vacancies')">Магазин та склад</a></li>
        <li><a onclick="App.navigate('courier')">Кур'єри</a></li>
        <li><a onclick="App.filters.category='Офіс';App.navigate('vacancies')">Офіс Сільпо</a></li>
        <li><a onclick="App.navigate('vacancies')">Всі вакансії</a></li>
      </ul></div>
      <div><h4>Компанія</h4><ul>
        <li><a onclick="App.navigate('about')">Про Fozzy Group</a></li>
        <li><a onclick="App.navigate('about')">Цінності</a></li>
        <li><a href="mailto:career@silpo.ua">Контакти HR</a></li>
      </ul></div>
    </div><div class="footer-bottom"><span>© 2025 Fozzy Group</span><span>Політика конфіденційності</span></div></footer>`;
  }
};

// INIT
App.init();
</script>
</body>
</html>
